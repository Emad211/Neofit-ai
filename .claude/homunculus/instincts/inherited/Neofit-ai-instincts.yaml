# Neofit Ai Workflow Release Version Workflow

## Action

Follow the release-version-workflow workflow:
1. Create new manifest.json under releases/{version}/
2. Add or update README.md, RELEASE_NOTES.md, and/or STATUS.md under releases/{version}/
3. Optionally, add SUPERSEDED.md if superseding a previous release
4. Update main project README.md to reflect new release

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: mobile/data/ifkb/releases/{version}/manifest.json, mobile/data/ifkb/releases/{version}/README.md, mobile/data/ifkb/releases/{version}/RELEASE_NOTES.md

