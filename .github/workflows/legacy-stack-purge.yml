name: Legacy Stack Purge

on:
  push:
    branches:
      - revival/firebase-ui-front
    paths:
      - '.github/workflows/legacy-stack-purge.yml'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/legacy-stack-purge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revival/firebase-ui-front
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Remove legacy services and workspace artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src/ai src/lib/firebase.ts src/lib/firebase-admin.ts .idx
          rm -f .firebaserc apphosting.yaml .modified

          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const name of ['@genkit-ai/googleai', '@genkit-ai/next', 'firebase', 'firebase-admin', 'genkit']) delete packageJson.dependencies?.[name];
          delete packageJson.devDependencies?.['genkit-cli'];
          packageJson.name = 'neofit-web';
          packageJson.engines = { node: '22.x' };
          packageJson.scripts = { ...packageJson.scripts, typecheck: 'tsc --noEmit' };
          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
          NODE

          cat > README.md <<'EOF'
          # NeoFit Web

          رابط کامل وب نئوفیت بر پایهٔ Next.js، با رابط فارسی و راست‌به‌چپ.

          ## وضعیت این شاخه

          - فرانت تاریخی و کامل‌تر نئوفیت به‌عنوان پایهٔ رابط کاربری احیا شده است.
          - داده‌های نسخهٔ Preview در مرورگر نگه‌داری می‌شوند.
          - محاسبات و کاتالوگ نهایی باید از Shared Nutrition Core تأمین شوند.
          - حساب کاربری و همگام‌سازی در مسیر معماری جدید پروژه متصل می‌شوند.

          ```bash
          npm ci
          npm run dev
          npm run typecheck
          npm run build
          ```
          EOF

      - name: Regenerate dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Assert source and dependency purge
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          parts = [('fire','base'), ('fire','store'), ('gen','kit'), ('app','hosting'), ('google','ai'), ('dot','prompt')]
          needles = [''.join(p).lower() for p in parts] + ['next_public_' + ''.join(parts[0]).lower(), '@/ai/']
          failures = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts or 'node_modules' in path.parts or 'artifacts' in path.parts:
                  continue
              try:
                  text = path.read_text(errors='ignore').lower()
              except Exception:
                  continue
              for needle in needles:
                  if needle in text:
                      failures.append(f'{path}: {needle}')
          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          PY
          git status --short

      - name: Commit cleaned source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NeoFit Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          git commit -m 'refactor(revival): purge legacy cloud and generation stack'
          git push origin HEAD:revival/firebase-ui-front
