name: One-shot Stage 5 archetype wiring

on:
  push:
    branches:
      - agent/iranian-food-kb-foundation
    paths:
      - '.github/workflows/one-shot-stage5-archetype-wiring.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iranian-food-kb-foundation
          fetch-depth: 0

      - name: Wire archetype seed and Stage 5 builder
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count} for {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'mobile/src/db/food-repository-impl.ts',
              "import { IRANIAN_FALLBACK_SEED } from '@/data/iranian-fallback-seed.generated';",
              "import { IRANIAN_ARCHETYPE_FALLBACK_SEED } from '@/data/iranian-fallback-archetypes';",
          )
          replace_exact(
              'mobile/src/db/food-repository-impl.ts',
              '  ...IRANIAN_FALLBACK_SEED,',
              '  ...IRANIAN_ARCHETYPE_FALLBACK_SEED,',
          )

          replace_exact(
              'mobile/scripts/audit-full-nutrition-catalog.ts',
              "import { IRANIAN_FALLBACK_SEED } from '../src/data/iranian-fallback-seed.generated';",
              "import { IRANIAN_ARCHETYPE_FALLBACK_SEED } from '../src/data/iranian-fallback-archetypes';",
          )
          replace_exact(
              'mobile/scripts/audit-full-nutrition-catalog.ts',
              'IRANIAN_FALLBACK_SEED',
              'IRANIAN_ARCHETYPE_FALLBACK_SEED',
          )

          replace_exact(
              '.github/workflows/mobile-ci.yml',
              'npx tsx scripts/build-iranian-app-dataset.ts',
              'npx tsx scripts/build-iranian-app-dataset-stage5.ts',
          )
          replace_exact(
              '.github/workflows/mobile-ci.yml',
              'name: neofit-iranian-app-dataset-stage3',
              'name: neofit-iranian-app-dataset-stage5',
          )
          PY

      - name: Commit wiring and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-stage5-archetype-wiring.yml
          git add mobile/src/db/food-repository-impl.ts mobile/scripts/audit-full-nutrition-catalog.ts .github/workflows/mobile-ci.yml
          git commit -m "feat(nutrition): wire Stage 5 archetype fallbacks"
          git push origin HEAD:agent/iranian-food-kb-foundation
