name: IFKB P0 Candidate Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ifkb-wikimedia-commons
  cancel-in-progress: false

jobs:
  discover-licensed-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Discover and download licence-compatible candidates
        run: |
          python ifkb/images/discover_commons_candidates.py \
            --queries ifkb/images/p0_candidate_queries.csv \
            --output build/ifkb-p0-candidates-v0.11

      - name: Verify candidate output
        run: |
          test -s build/ifkb-p0-candidates-v0.11/candidate_manifest.csv
          test -s build/ifkb-p0-candidates-v0.11/class_summary.csv
          test -s build/ifkb-p0-candidates-v0.11/dataset_manifest.json
          test -s build/ifkb-p0-candidates-v0.11/ATTRIBUTION.md

      - name: Upload candidate-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ifkb-p0-candidates-v0.11
          path: build/ifkb-p0-candidates-v0.11
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
