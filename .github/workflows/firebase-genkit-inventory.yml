name: Legacy Stack Inventory

on:
  push:
    branches:
      - revival/firebase-ui-front
    paths:
      - '.github/workflows/firebase-genkit-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory all tracked references
        shell: bash
        run: |
          set -uo pipefail
          echo '=== NAMED FILES ==='
          git ls-files | grep -Ei 'firebase|firestore|genkit|apphosting|\.idx' || true
          echo '=== TEXT REFERENCES ==='
          rg -n -i 'firebase|firestore|genkit|apphosting|googleai|dotprompt|NEXT_PUBLIC_FIREBASE|FIREBASE_|@/ai/' --glob '!package-lock.json' --glob '!artifacts/**' . || true
          echo '=== LOCK PACKAGES ==='
          node -e "const l=require('./package-lock.json'); const m=Object.keys(l.packages||{}).filter(k=>/firebase|genkit|googleai|dotprompt/i.test(k)); console.log(m.join('\\n')); console.log('MATCH_COUNT='+m.length)"
