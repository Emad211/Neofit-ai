name: IFKB FNDDS Universal Food Layer

# This source rebuild is intentionally manual. Pull-request path filters are
# insufficient here because every synchronize event sees the full PR diff.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ifkb-fndds-universal-layer
  cancel-in-progress: false

jobs:
  build-fndds-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build universal FNDDS app layer
        run: |
          python ifkb/universal/import_fndds_app_layer.py \
            --output build/ifkb-fndds-2021-2023

      - name: Verify outputs and nutrient coverage
        run: |
          test -s build/ifkb-fndds-2021-2023/fndds_2021_2023_app_layer.json
          test -s build/ifkb-fndds-2021-2023/fndds_2021_2023_app_layer.sqlite
          test -s build/ifkb-fndds-2021-2023/fndds_2021_2023_foods.csv
          test -s build/ifkb-fndds-2021-2023/manifest.json
          test -s build/ifkb-fndds-2021-2023/nutrient_diagnostic.json
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          root=Path('build/ifkb-fndds-2021-2023')
          manifest=json.loads((root/'manifest.json').read_text())
          diagnostic=json.loads((root/'nutrient_diagnostic.json').read_text())
          db=sqlite3.connect(root/'fndds_2021_2023_app_layer.sqlite')
          count=db.execute('select count(*) from foods').fetchone()[0]
          portions=db.execute('select count(*) from portions').fetchone()[0]
          complete=db.execute('''
            select count(*) from foods
            where calories_kcal is not null and protein_g is not null
              and fat_g is not null and carbs_g is not null
          ''').fetchone()[0]
          egg_white=db.execute("select count(*) from foods where lower(name_en) like '%egg white%'").fetchone()[0]
          salads=db.execute("select count(*) from foods where lower(name_en) like '%salad%'").fetchone()[0]
          db.close()
          assert count == manifest['foodCount'] and count > 5000, (count,manifest)
          assert complete == manifest['completeMacroCount'] and complete >= int(count*0.95), diagnostic
          assert portions > count, portions
          assert egg_white > 0 and salads > 20, (egg_white,salads)
          print({'foods':count,'completeMacros':complete,'portions':portions,'eggWhiteRecords':egg_white,'salads':salads})
          PY

      - name: Upload app layer and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ifkb-fndds-2021-2023-app-layer
          path: |
            build/ifkb-fndds-2021-2023/fndds_2021_2023_app_layer.json
            build/ifkb-fndds-2021-2023/fndds_2021_2023_app_layer.sqlite
            build/ifkb-fndds-2021-2023/fndds_2021_2023_foods.csv
            build/ifkb-fndds-2021-2023/manifest.json
            build/ifkb-fndds-2021-2023/nutrient_diagnostic.json
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
