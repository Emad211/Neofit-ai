name: Android QA APK

on:
  push:
    branches:
      - automation/stage9-android-qa
    paths:
      - 'mobile/**'
      - 'docs/releases/NEOFIT_STAGE9_ANDROID_QA.md'
      - '.github/workflows/android-qa-apk.yml'
  pull_request:
    branches:
      - agent/iranian-food-kb-foundation
    paths:
      - 'mobile/**'
      - 'docs/releases/NEOFIT_STAGE9_ANDROID_QA.md'
      - '.github/workflows/android-qa-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-qa-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify AvalAI key settings contract
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          grep -q "router.push('/ai-settings')" 'mobile/app/(tabs)/settings.tsx'
          grep -q 'setAvalAiApiKey' mobile/app/ai-settings.tsx
          grep -q 'secureTextEntry' mobile/app/ai-settings.tsx
          grep -q 'WHEN_UNLOCKED_THIS_DEVICE_ONLY' mobile/src/services/secure-settings.ts
          grep -q 'getAvalAiApiKey' mobile/src/services/avalai-client.ts

      - name: Run deterministic tests
        run: npm test

      - name: Validate Expo and TypeScript
        run: |
          npx expo install --check
          npm run doctor
          npm run typecheck

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build universal debug APK
        run: |
          chmod +x android/gradlew
          android/gradlew -p android assembleDebug --no-daemon --stacktrace

      - name: Verify APK and generate metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p qa-artifact
          cp "$APK" qa-artifact/neofit-stage9-qa.apk
          sha256sum qa-artifact/neofit-stage9-qa.apk | tee qa-artifact/neofit-stage9-qa.apk.sha256
          {
            echo "commit=${GITHUB_SHA}"
            echo "package=com.emad211.neofit"
            echo "version=0.1.0"
            echo "versionCode=1"
            echo "buildType=debug"
            echo "builtAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sizeBytes=$(stat -c%s qa-artifact/neofit-stage9-qa.apk)"
          } > qa-artifact/build-metadata.txt

      - name: Upload installable QA APK
        uses: actions/upload-artifact@v4
        with:
          name: neofit-stage9-android-qa-apk
          path: mobile/qa-artifact
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
