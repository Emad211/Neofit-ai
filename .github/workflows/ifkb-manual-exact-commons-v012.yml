name: IFKB Manual Exact Commons v0.12

on:
  pull_request:
    branches:
      - agent/mobile-local-first-expo
    types: [opened, synchronize, reopened]
    paths:
      - 'ifkb/images/manual_exact_commons_manifest_v0.12.csv'
      - '.github/workflows/ifkb-manual-exact-commons-v012.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ifkb-open-media-acquisition
  cancel-in-progress: false

jobs:
  acquire-manual-exact-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Download and audit exact Wikimedia Commons images
        run: |
          python ifkb/images/download_commons_images.py \
            --manifest ifkb/images/manual_exact_commons_manifest_v0.12.csv \
            --output build/ifkb-manual-exact-v0.12

      - name: Verify release outputs
        run: |
          test -s build/ifkb-manual-exact-v0.12/resolved_manifest.csv
          test -s build/ifkb-manual-exact-v0.12/ATTRIBUTION.md
          test -s build/ifkb-manual-exact-v0.12/dataset_manifest.json

      - name: Upload exact image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ifkb-manual-exact-v0.12
          path: build/ifkb-manual-exact-v0.12
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
