name: Mobile CI

on:
  push:
    branches:
      - agent/mobile-local-first-expo
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Capture locked install diagnostics
        id: install
        shell: bash
        run: |
          set +e
          npm ci --no-audit --no-fund > npm-ci.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload locked install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-ci-diagnostics
          path: mobile/npm-ci.log
          if-no-files-found: error
          retention-days: 3

      - name: Enforce locked install
        if: steps.install.outputs.exit_code != '0'
        run: exit 1

      - name: Check Expo package versions
        run: npx expo install --check

      - name: Expo dependency doctor
        run: npm run doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist
