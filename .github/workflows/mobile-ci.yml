name: Mobile CI

on:
  push:
    branches:
      - agent/mobile-local-first-expo
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Regenerate mobile dependency lock
        run: npm install --no-audit --no-fund

      - name: Commit regenerated lockfile
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- package-lock.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "refresh mobile dependency lock"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Check Expo package versions
        run: npx expo install --check

      - name: Expo dependency doctor
        run: npm run doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist
