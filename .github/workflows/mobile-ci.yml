name: Mobile CI

on:
  push:
    branches:
      - agent/mobile-local-first-expo
  pull_request:
    branches:
      - master
      - agent/mobile-local-first-expo

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install locked mobile dependencies
        run: npm ci --no-audit --no-fund > /tmp/npm-ci.log 2>&1 || { cat /tmp/npm-ci.log; exit 1; }

      - name: Run deterministic domain tests
        run: npm test > /tmp/npm-test.log 2>&1 || { cat /tmp/npm-test.log; exit 1; }

      - name: Check Expo package versions
        run: npx expo install --check > /tmp/expo-check.log 2>&1 || { cat /tmp/expo-check.log; exit 1; }

      - name: Expo dependency doctor
        run: npm run doctor > /tmp/expo-doctor.log 2>&1 || { cat /tmp/expo-doctor.log; exit 1; }

      - name: Strict TypeScript
        run: npm run typecheck

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist > /tmp/expo-export.log 2>&1 || { cat /tmp/expo-export.log; exit 1; }
