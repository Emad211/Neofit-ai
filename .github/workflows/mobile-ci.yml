name: Mobile CI

on:
  push:
    branches:
      - agent/mobile-local-first-expo
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Check Expo package versions
        run: npm exec --workspace neofit-mobile -- expo install --check

      - name: Expo dependency doctor
        run: npm --workspace neofit-mobile run doctor

      - name: Typecheck
        run: npm --workspace neofit-mobile run typecheck

      - name: Export Android bundle
        run: npm exec --workspace neofit-mobile -- expo export --platform android --output-dir dist
