name: Mobile CI

on:
  push:
    branches:
      - agent/mobile-local-first-expo
  pull_request:
    branches:
      - master
      - agent/mobile-local-first-expo

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked mobile dependencies
        run: npm ci --no-audit --no-fund > /tmp/npm-ci.log 2>&1 || { cat /tmp/npm-ci.log; exit 1; }

      - name: Run deterministic domain tests
        run: npm test > /tmp/npm-test.log 2>&1 || { cat /tmp/npm-test.log; exit 1; }

      - name: Upload deterministic test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-diagnostics
          path: /tmp/npm-test.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Run IFKB Python contract tests
        working-directory: ifkb/universal
        run: |
          python -m unittest -v test_natural_query_corpus.py \
            > /tmp/ifkb-python-tests.log 2>&1 \
            || { cat /tmp/ifkb-python-tests.log; exit 1; }

      - name: Upload IFKB Python diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ifkb-python-test-diagnostics
          path: /tmp/ifkb-python-tests.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Run fail-closed DS2 normalization gate
        working-directory: .
        run: |
          mkdir -p build/ds2-normalization
          python -m unittest -v \
            ifkb/digital_v0131/test_normalization_gate.py \
            ifkb/digital_v0131/test_official_portion_audit.py \
            > /tmp/ifkb-ds2-normalization.log 2>&1 \
            || { cat /tmp/ifkb-ds2-normalization.log; exit 1; }
          python ifkb/digital_v0131/normalization_gate/verify_consensus_alignment.py \
            --consensus-csv ifkb/digital_v0131/ds2_consensus_profiles.csv \
            --status-json ifkb/digital_v0131/normalization_gate/current-status.v1.json \
            --report build/ds2-normalization/consensus-alignment-report.json \
            >> /tmp/ifkb-ds2-normalization.log 2>&1 \
            || { cat /tmp/ifkb-ds2-normalization.log; exit 1; }
          python ifkb/digital_v0131/normalization_gate/validate_source_work_queue.py \
            --queue ifkb/digital_v0131/normalization_gate/source-record-normalization-work-queue.v1.json \
            --gate-status ifkb/digital_v0131/normalization_gate/current-status.v1.json \
            --report build/ds2-normalization/source-work-queue-report.json \
            >> /tmp/ifkb-ds2-normalization.log 2>&1 \
            || { cat /tmp/ifkb-ds2-normalization.log; exit 1; }
          python ifkb/digital_v0131/normalization_gate/audit_official_portion_candidates.py \
            --database mobile/assets/ifkb/ifkb-universal-v1.db \
            --manifest mobile/assets/ifkb/ifkb-universal-v1.manifest.json \
            --queue ifkb/digital_v0131/normalization_gate/unit-conversion-work-queue.v1.json \
            --spec ifkb/digital_v0131/normalization_gate/official-portion-audit-spec.v1.json \
            --report build/ds2-normalization/official-portion-candidates.json \
            >> /tmp/ifkb-ds2-normalization.log 2>&1 \
            || { cat /tmp/ifkb-ds2-normalization.log; exit 1; }
          python ifkb/digital_v0131/normalization_gate/validate_normalization_gate.py \
            --input ifkb/digital_v0131/normalization_gate/current-status.v1.json \
            --report build/ds2-normalization/draft-report.json \
            --mode draft \
            --require-v0131-profile-set \
            >> /tmp/ifkb-ds2-normalization.log 2>&1 \
            || { cat /tmp/ifkb-ds2-normalization.log; exit 1; }

      - name: Upload DS2 normalization diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ifkb-ds2-normalization-diagnostics
          path: /tmp/ifkb-ds2-normalization.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Upload DS2 normalization reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ifkb-ds2-normalization-gate-report
          path: build/ds2-normalization
          if-no-files-found: error
          retention-days: 30

      - name: Generate schema and ID freeze candidate
        run: |
          npx tsx scripts/audit-schema-freeze-candidate.ts \
            --output ../build/schema-freeze-candidate/manifest.json \
            > /tmp/schema-freeze-candidate.log 2>&1 \
            || { cat /tmp/schema-freeze-candidate.log; exit 1; }

      - name: Upload schema freeze diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-freeze-candidate-diagnostics
          path: /tmp/schema-freeze-candidate.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Upload schema and ID freeze candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neofit-schema-id-freeze-candidate
          path: build/schema-freeze-candidate/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Check Expo package versions
        run: npx expo install --check > /tmp/expo-check.log 2>&1 || { cat /tmp/expo-check.log; exit 1; }

      - name: Expo dependency doctor
        run: npm run doctor > /tmp/expo-doctor.log 2>&1 || { cat /tmp/expo-doctor.log; exit 1; }

      - name: Strict TypeScript
        run: npm run typecheck > /tmp/typecheck.log 2>&1 || { cat /tmp/typecheck.log; exit 1; }

      - name: Upload TypeScript diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-typecheck-diagnostics
          path: /tmp/typecheck.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist > /tmp/expo-export.log 2>&1 || { cat /tmp/expo-export.log; exit 1; }
