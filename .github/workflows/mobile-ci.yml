name: Mobile CI

on:
  push:
    branches:
      - agent/mobile-local-first-expo
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Check Expo package versions
        run: npm exec --workspace neofit-mobile -- expo install --check

      - name: Capture Expo Doctor diagnostics
        id: doctor
        shell: bash
        run: |
          set +e
          npm --workspace neofit-mobile run doctor > mobile/expo-doctor.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Expo Doctor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-doctor-diagnostics
          path: mobile/expo-doctor.log
          if-no-files-found: error
          retention-days: 3

      - name: Typecheck
        run: npm --workspace neofit-mobile run typecheck

      - name: Export Android bundle
        run: npm exec --workspace neofit-mobile -- expo export --platform android --output-dir dist

      - name: Enforce Expo Doctor result
        if: steps.doctor.outputs.exit_code != '0'
        run: |
          cat mobile/expo-doctor.log
          exit 1
