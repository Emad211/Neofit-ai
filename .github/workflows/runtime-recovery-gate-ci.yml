name: Runtime Recovery Gate CI

on:
  push:
    branches:
      - 'stage21/**'
    paths:
      - 'web/app/page.tsx'
      - 'web/app/auth/**'
      - 'web/app/layout.tsx'
      - 'web/components/pwa-register.tsx'
      - 'web/lib/auth/**'
      - 'web/lib/nutrition-adapter.ts'
      - 'web/lib/web-diary-storage.ts'
      - 'web/tests/runtime-recovery-gate.test.ts'
      - 'web/package.json'
      - '.github/workflows/runtime-recovery-gate-ci.yml'
  pull_request:
    branches:
      - stage20/ui-truth-empty-states
    paths:
      - 'web/app/page.tsx'
      - 'web/app/auth/**'
      - 'web/app/layout.tsx'
      - 'web/components/pwa-register.tsx'
      - 'web/lib/auth/**'
      - 'web/lib/nutrition-adapter.ts'
      - 'web/lib/web-diary-storage.ts'
      - 'web/tests/runtime-recovery-gate.test.ts'
      - 'web/package.json'
      - '.github/workflows/runtime-recovery-gate-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_VERCEL_ENV: preview
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_value
      AI_CREDENTIAL_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      AUTH_RECOVERY_INTENT_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: |
            web/package.json
            packages/nutrition-core/package.json
      - name: Install workspace dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Runtime recovery contracts
        working-directory: web
        run: npm run test:runtime-recovery
      - name: Auth regression
        working-directory: web
        run: npm run test:auth-production
      - name: Full Supabase app regression
        working-directory: web
        run: npm run test:supabase-app
      - name: TypeScript
        working-directory: web
        run: npm run typecheck
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Built Next public/Auth/static smoke
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          env -u NEXT_PUBLIC_SUPABASE_URL -u NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            ../node_modules/.bin/next start -H 127.0.0.1 -p 3100 >/tmp/neofit-runtime-recovery.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          READY=0
          for i in $(seq 1 30); do
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/sw.js || true)
            if [ "$STATUS" = "200" ]; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/neofit-runtime-recovery.log
            exit 1
          fi

          AUTH_STATUS=$(curl -sS -o /tmp/auth.body -w '%{http_code}' http://127.0.0.1:3100/auth)
          test "$AUTH_STATUS" = "200"
          grep -q 'ورود به حساب' /tmp/auth.body
          grep -q 'ساخت حساب امن' /tmp/auth.body

          ROOT_STATUS=$(curl -sS -D /tmp/root.headers -o /tmp/root.body -w '%{http_code}' http://127.0.0.1:3100/)
          test "$ROOT_STATUS" = "307"
          grep -Eiq '^location: /today\r?$' /tmp/root.headers

          curl -sS http://127.0.0.1:3100/sw.js -o /tmp/neofit-runtime-recovery-sw.tmp
          grep -q 'neofit-app-shell-' /tmp/neofit-runtime-recovery-sw.tmp
      - name: Hard recovery boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q "activeAuthSession(supabase)" web/app/page.tsx
          grep -q "if (!active) redirect('/auth')" web/app/page.tsx
          grep -q "activeAuthSession(supabase)" web/app/auth/page.tsx
          if grep -q "supabase.auth.getClaims()" web/app/auth/page.tsx; then
            echo 'Auth page must not redirect using claims-only identity.' >&2
            exit 1
          fi
          grep -q "environment === 'preview'" web/components/pwa-register.tsx
          grep -q 'getRegistrations' web/components/pwa-register.tsx
          grep -q 'ZERO_WEB_MACROS' web/lib/nutrition-adapter.ts
