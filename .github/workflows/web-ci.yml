name: Web CI

on:
  push:
    branches:
      - web/pwa-foundation
      - stage2/pwa-vercel-foundation
      - 'stage2b/**'
      - 'stage3/**'
    paths:
      - 'package.json'
      - 'vercel.json'
      - 'web/**'
      - 'packages/nutrition-core/**'
      - '.github/workflows/web-ci.yml'
      - 'README.md'
      - 'docs/DEVELOPMENT_HANDOFF.md'
      - 'docs/NEOFIT_WEB_NUTRITION_ADAPTER_AUTHORITY_MAP.md'
      - 'docs/NEOFIT_MASTER_PLAN.md'
      - 'docs/NEOFIT_PROGRESS_LOG.md'
  pull_request:
    branches:
      - web/pwa-foundation
    paths:
      - 'package.json'
      - 'vercel.json'
      - 'web/**'
      - 'packages/nutrition-core/**'
      - '.github/workflows/web-ci.yml'
      - 'README.md'
      - 'docs/DEVELOPMENT_HANDOFF.md'
      - 'docs/NEOFIT_WEB_NUTRITION_ADAPTER_AUTHORITY_MAP.md'
      - 'docs/NEOFIT_MASTER_PLAN.md'
      - 'docs/NEOFIT_PROGRESS_LOG.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_VERCEL_ENV: preview
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: |
            package.json
            web/package.json
            packages/nutrition-core/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Initialize evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '{"commit":"%s","status":"preflight"}\n' "$GITHUB_SHA" > artifacts/preflight.json

      - name: Verify product, PWA, Vercel and nutrition-adapter contracts
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'lang="fa" dir="rtl"' web/app/layout.tsx
          grep -q '@fontsource-variable/vazirmatn' web/app/layout.tsx
          grep -q 'manifest.webmanifest' web/app/layout.tsx
          grep -q 'PwaRegister' web/app/layout.tsx
          grep -q "url.pathname.startsWith('/api/')" web/public/sw.js
          grep -q "request.headers.has('authorization')" web/public/sw.js
          grep -q 'window.scrollTo' web/components/neofit-prototype.tsx
          grep -q 'NEXT_PUBLIC_VERCEL_ENV' web/lib/environment.ts
          grep -q '@neofit/nutrition-core' web/package.json
          grep -q 'transpilePackages' web/next.config.ts
          grep -q 'summarizeWebDiary' web/components/neofit-prototype.tsx
          grep -q 'calculateVariantNutrition' web/lib/nutrition-adapter.ts
          grep -q 'calculateRecipe' web/lib/nutrition-adapter.ts
          grep -q 'summarizeDiaryDay' web/lib/nutrition-adapter.ts
          grep -q 'calculateGoalProgress' web/lib/nutrition-adapter.ts
          test -s docs/NEOFIT_WEB_NUTRITION_ADAPTER_AUTHORITY_MAP.md
          test -s web/tests/web-nutrition-adapter-golden-v1.ts
          test -s web/tests/web-nutrition-adapter.test.ts
          test -s packages/nutrition-core/src/index.ts
          test -s web/app/manifest.ts
          test -s web/app/offline/page.tsx
          test -s web/app/error.tsx
          test -s web/app/global-error.tsx
          test -s web/app/loading.tsx
          test -s web/app/not-found.tsx
          test -s web/vercel.json
          test -s package.json
          test -s vercel.json
          grep -q '"workspaces"' package.json
          grep -q '"web"' package.json
          grep -q '"packages/nutrition-core"' package.json
          grep -q '"next": "16.2.12"' package.json
          grep -q '"build:web": "npm --workspace @neofit/web run build"' package.json
          grep -q '"framework": "nextjs"' vercel.json
          grep -q '"installCommand": "npm install --no-audit --no-fund"' vercel.json
          grep -q '"buildCommand": "npm run build:web"' vercel.json
          grep -q '"outputDirectory": "web/.next"' vercel.json

      - name: TypeScript
        run: npm run typecheck

      - name: Web nutrition adapter parity tests
        run: npm run test:adapter

      - name: Production build
        run: npm run build

      - name: Verify generated icon files
        shell: bash
        run: |
          set -euo pipefail
          test -s public/icons/icon-192.png
          test -s public/icons/icon-512.png
          test -s public/icons/icon-maskable-512.png
          test -s public/icons/apple-touch-icon.png
          file public/icons/*.png

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual and PWA runtime gates
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/neofit-web.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/neofit-web.log
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3000/ > /dev/null
          npm run visual:capture
          npm run pwa:verify
          cat artifacts/stage1-visual/visual-report.json
          cat artifacts/pwa/pwa-report.json

      - name: Write Web adapter and Vercel evidence metadata
        shell: bash
        run: |
          set -euo pipefail
          printf '{\n  "commit": "%s",\n  "package": "@neofit/web",\n  "nutritionCore": "@neofit/nutrition-core",\n  "batch5Merge": "d3c0a28ecf2596e94c86ff74e2f00a0523219433",\n  "webFixtureAuthorityBlob": "08e623948b84e4e4e261528b1c332ae2e76af4b7",\n  "webPrototypeAuthorityBlob": "add0839d207e5b3b12288657fe53077c9a4fda0a",\n  "mobileLegacyUiAdapterBlob": "bbacac7a376ba9edb14b14f673d3d708dfa3319e",\n  "coreLegacyAdapterBlob": "eb4be071cfb3ccc6bb03261abf49aa7ae972028d",\n  "coreSearchBlob": "3dc081e6f22f9d98518ad7411bcbd5c6394cc983",\n  "coreDiaryBlob": "e297eed728a7457b9b46529a761e450bd647e97d",\n  "nutritionArithmetic": "shared-core-only",\n  "webPackageStrategy": "npm-workspace",\n  "vercelEntrypoint": "repository-root-vercel-json",\n  "vercelFramework": "nextjs",\n  "vercelApplicationRoot": "web",\n  "generatedAt": "%s"\n}\n' \
            "$GITHUB_SHA" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > artifacts/web-adapter-metadata.json
          cat artifacts/web-adapter-metadata.json

      - name: Prepare reproducible Vercel source bundle
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/artifacts/vercel
          tar \
            --exclude='web/node_modules' \
            --exclude='web/.next' \
            --exclude='web/artifacts' \
            --exclude='web/.env*' \
            --exclude='web/tsconfig.tsbuildinfo' \
            --exclude='packages/nutrition-core/node_modules' \
            --exclude='packages/nutrition-core/artifacts' \
            -czf web/artifacts/vercel/neofit-web-source.tar.gz \
            package.json vercel.json web packages/nutrition-core
          sha256sum web/artifacts/vercel/neofit-web-source.tar.gz | tee web/artifacts/vercel/neofit-web-source.sha256
          printf '{"commit":"%s","branch":"%s","includes":["package.json","vercel.json","web","packages/nutrition-core"],"generatedAt":"%s"}\n' \
            "$GITHUB_SHA" \
            "$GITHUB_HEAD_REF" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > web/artifacts/vercel/source-metadata.json

      - name: Upload web evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neofit-web-ci-evidence
          path: web/artifacts
          if-no-files-found: error
          retention-days: 30
