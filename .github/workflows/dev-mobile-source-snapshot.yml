name: Apply Nutrition Integration Batch

on:
  pull_request:
    branches:
      - agent/mobile-local-first-expo
    paths:
      - '.github/workflows/dev-mobile-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Emad211/Neofit-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iranian-food-kb-foundation
          fetch-depth: 0
      - name: Apply tested integration files
        shell: bash
        run: |
          cat > /tmp/neofit-integration.b64 <<'PAYLOAD'

PAYLOAD
          base64 --decode /tmp/neofit-integration.b64 | tar -xzf -
          rm .github/workflows/dev-mobile-source-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(nutrition): integrate Vision API identity with local IFKB calculation'
          git push origin HEAD:agent/iranian-food-kb-foundation
