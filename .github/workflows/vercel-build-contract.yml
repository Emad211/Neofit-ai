name: Vercel Build Contract

on:
  push:
    branches:
      - web/pwa-foundation
      - web/full-frontend-integration
      - vercel/preview
      - 'fix/**'
    paths:
      - package.json
      - vercel.json
      - .vercel-deploy
      - scripts/vercel-ignore.mjs
      - web/**
      - packages/nutrition-core/**
      - .github/workflows/vercel-build-contract.yml
  pull_request:
    branches:
      - web/pwa-foundation
    paths:
      - package.json
      - vercel.json
      - .vercel-deploy
      - scripts/vercel-ignore.mjs
      - web/**
      - packages/nutrition-core/**
      - .github/workflows/vercel-build-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-build-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_VERCEL_ENV: preview
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Verify repository-root Vercel contract
        shell: bash
        run: |
          set -euo pipefail
          test -s package.json
          test -s vercel.json
          test -s .vercel-deploy
          test -s scripts/vercel-ignore.mjs
          node --check scripts/vercel-ignore.mjs
          grep -q '"workspaces"' package.json
          grep -q '"web"' package.json
          grep -q '"packages/nutrition-core"' package.json
          grep -q '"next": "16.2.12"' package.json
          grep -q '"build:web": "npm --workspace @neofit/web run build"' package.json
          grep -q '"framework": "nextjs"' vercel.json
          grep -q '"ignoreCommand": "node scripts/vercel-ignore.mjs"' vercel.json
          grep -q '"vercel/preview": true' vercel.json
          grep -q '"\*": false' vercel.json
          grep -q '"installCommand": "npm install --no-audit --no-fund"' vercel.json
          grep -q '"buildCommand": "npm run build:web"' vercel.json
          grep -q '"outputDirectory": "web/.next"' vercel.json
          grep -q "CANONICAL_RELEASE_BRANCH = 'vercel/preview'" scripts/vercel-ignore.mjs
          grep -q "process.env.VERCEL_ENV !== 'preview'" scripts/vercel-ignore.mjs
          grep -q 'release-branch: vercel/preview' .vercel-deploy

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck:web

      - name: Production build
        run: npm run build:web
