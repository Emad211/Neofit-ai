name: IFKB P0 Rate-Limit Retry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ifkb-wikimedia-commons
  cancel-in-progress: false

jobs:
  retry-rate-limited-classes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Wait before Wikimedia retry
        run: sleep 45

      - name: Discover candidates with request pacing and exponential backoff
        run: |
          python ifkb/images/run_rate_limited_candidate_discovery.py \
            --queries ifkb/images/p0_wave3_rate_limit_retry_queries.csv \
            --output build/ifkb-p0-rate-limit-retry-v0.11.3 \
            --base-delay-seconds 3.0 \
            --max-attempts 6

      - name: Verify retry output
        run: |
          test -s build/ifkb-p0-rate-limit-retry-v0.11.3/class_summary.csv
          test -s build/ifkb-p0-rate-limit-retry-v0.11.3/dataset_manifest.json
          test -s build/ifkb-p0-rate-limit-retry-v0.11.3/ATTRIBUTION.md

      - name: Upload retry candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ifkb-p0-rate-limit-retry-v0.11.3
          path: build/ifkb-p0-rate-limit-retry-v0.11.3
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
