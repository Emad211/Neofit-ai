name: Apply Food Search Shortcuts

on:
  pull_request:
    branches:
      - agent/mobile-local-first-expo
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apply-food-search-shortcuts.yml'
      - 'ifkb/dev/apply-food-search-shortcuts.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iranian-food-kb-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Wire shortcuts into comprehensive search
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mobile/app/food-search.tsx')
          text = path.read_text(encoding='utf-8')

          old_import = "import { useAppTheme } from '@/theme/theme';\n"
          new_import = "import { useAppTheme } from '@/theme/theme';\nimport {\n  FoodSearchShortcuts,\n  type FavoriteCandidate,\n} from '@/components/food-search-shortcuts';\n"
          if text.count(old_import) != 1:
              raise SystemExit('theme import anchor mismatch')
          text = text.replace(old_import, new_import)

          anchor = """  const hasPortions = portions.length > 0;\n\n  const estimate = React.useMemo<NutritionEstimate | null>(() => {\n"""
          insertion = """  const hasPortions = portions.length > 0;\n  const favoriteCandidate = React.useMemo<FavoriteCandidate | null>(() => {\n    if (!selection) return null;\n    if (selection.kind === 'local') {\n      return {\n        id: `local:${selection.variant.id}`,\n        labelFa: selection.concept.nameFa,\n        labelEn: selection.concept.nameEn,\n        query: selection.concept.nameFa || selection.concept.nameEn,\n      };\n    }\n    const queryValue = selection.hit.matchedAliasFa ?? selection.details.nameEn;\n    return {\n      id: `universal:${selection.details.id}`,\n      labelFa: selection.hit.matchedAliasFa ?? selection.details.nameEn,\n      labelEn: selection.details.nameEn,\n      query: queryValue,\n    };\n  }, [selection]);\n\n  const estimate = React.useMemo<NutritionEstimate | null>(() => {\n"""
          if text.count(anchor) != 1:
              raise SystemExit('favorite candidate anchor mismatch')
          text = text.replace(anchor, insertion)

          card_anchor = """      </Card>\n\n      {searching ? <AppText muted>{label('Searching on device…', 'در حال جست‌وجو روی گوشی…')}</AppText> : null}\n"""
          card_insertion = """      </Card>\n\n      <FoodSearchShortcuts\n        locale={locale}\n        current={favoriteCandidate}\n        onSearch={(value) => {\n          setQuery(value);\n          setSelection(null);\n          setNotice(null);\n          setError(null);\n        }}\n      />\n\n      {searching ? <AppText muted>{label('Searching on device…', 'در حال جست‌وجو روی گوشی…')}</AppText> : null}\n"""
          if text.count(card_anchor) != 1:
              raise SystemExit('shortcut render anchor mismatch')
          path.write_text(text.replace(card_anchor, card_insertion), encoding='utf-8')
          PY
      - name: Validate shortcut integration
        working-directory: mobile
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm ci --no-audit --no-fund > /tmp/npm-ci.log 2>&1 || { cat /tmp/npm-ci.log; exit 1; }
          npm test > /tmp/npm-test.log 2>&1 || { cat /tmp/npm-test.log; exit 1; }
          npm run typecheck
      - name: Remove temporary files
        run: |
          rm -f ifkb/dev/apply-food-search-shortcuts.trigger
          rm -f .github/workflows/apply-food-search-shortcuts.yml
      - name: Commit verified integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(nutrition): add favorite and recent search shortcuts'
          git push origin HEAD:agent/iranian-food-kb-foundation
