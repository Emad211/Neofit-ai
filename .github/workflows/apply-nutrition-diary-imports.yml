name: Apply Nutrition Diary Imports

on:
  pull_request:
    branches:
      - agent/mobile-local-first-expo
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apply-nutrition-diary-imports.yml'
      - 'ifkb/dev/apply-nutrition-diary-imports.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iranian-food-kb-foundation
          fetch-depth: 0
      - name: Redirect meal reads and writes to Nutrition Diary
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('mobile/src/providers/app-provider.tsx'): (
                  "import { getDailySummary } from '@/db/log-repository';",
                  "import { getDailySummary } from '@/db/nutrition-meal-repository';",
              ),
              Path('mobile/app/(tabs)/nutrition.tsx'): (
                  "import { logMeal } from '@/db/log-repository';",
                  "import { logMeal } from '@/db/nutrition-meal-repository';",
              ),
              Path('mobile/app/meal-estimator.tsx'): (
                  "import { logMeal } from '@/db/log-repository';",
                  "import { logMeal } from '@/db/nutrition-meal-repository';",
              ),
              Path('mobile/app/iranian-foods.tsx'): (
                  "import { logMeal } from '@/db/log-repository';",
                  "import { logMeal } from '@/db/nutrition-meal-repository';",
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one import, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f ifkb/dev/apply-nutrition-diary-imports.trigger
          rm -f .github/workflows/apply-nutrition-diary-imports.yml
      - name: Commit import migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(nutrition): route all meal logs through Nutrition Diary'
          git push origin HEAD:agent/iranian-food-kb-foundation
