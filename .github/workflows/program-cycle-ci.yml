name: Program Cycle Lifecycle CI

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'web/app/(main)/program/**'
      - 'web/app/onboarding/ready/**'
      - 'web/lib/program-cycle/**'
      - 'web/lib/program-generation/**'
      - 'web/lib/supabase/database.types.ts'
      - 'web/tests/program-cycle-lifecycle.test.ts'
      - 'web/tests/program-generation.test.ts'
      - '.github/workflows/program-cycle-ci.yml'
  push:
    branches: ['main']
    paths:
      - 'supabase/migrations/**'
      - 'web/app/(main)/program/**'
      - 'web/app/onboarding/ready/**'
      - 'web/lib/program-cycle/**'
      - 'web/lib/program-generation/**'
      - 'web/lib/supabase/database.types.ts'
      - 'web/tests/program-cycle-lifecycle.test.ts'
      - 'web/tests/program-generation.test.ts'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package.json
            packages/nutrition-core/package.json
            packages/exercise-registry/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run test:program-cycle
      - run: npm run test:supabase-app
      - run: npm run typecheck
      - run: npm run build
