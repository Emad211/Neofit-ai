name: IFKB DS2 Normalization Gate

# This long-lived PR uses push path filters. pull_request path filters would
# inspect the full PR diff and rerun the gate for unrelated mobile edits.
on:
  push:
    branches:
      - agent/iranian-food-kb-foundation
    paths:
      - 'ifkb/digital_v0131/normalization_gate/**'
      - 'ifkb/digital_v0131/ds2_consensus_profiles.csv'
      - 'ifkb/digital_v0131/test_normalization_gate.py'
      - 'ifkb/digital_v0131/test_official_portion_audit.py'
      - 'ifkb/digital_v0131/test_official_portion_review_queue.py'
      - 'ifkb/digital_v0131/test_quantity_semantics.py'
      - 'mobile/assets/ifkb/ifkb-universal-v1.db'
      - 'mobile/assets/ifkb/ifkb-universal-v1.manifest.json'
      - '.github/workflows/ifkb-ds2-normalization-gate.yml'
  workflow_dispatch:
    inputs:
      enforce_release:
        description: 'Require every DS2 profile to be promotion-ready'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ifkb-ds2-normalization-gate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run complete DS2 normalization gate
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.enforce_release }}" = "true" ]; then
            ARGS+=(--enforce-release)
          fi
          python ifkb/digital_v0131/normalization_gate/run_normalization_gate.py \
            --output-dir build/ds2-normalization \
            "${ARGS[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ifkb-ds2-normalization-gate-report
          path: build/ds2-normalization
          if-no-files-found: error
          retention-days: 30
