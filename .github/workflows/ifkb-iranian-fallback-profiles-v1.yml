name: IFKB Iranian Fallback Profiles v1

on:
  pull_request:
    branches:
      - agent/mobile-local-first-expo
    types: [opened, synchronize, reopened]
    paths:
      - 'ifkb/universal/iranian_canon_v1.csv'
      - 'mobile/src/data/iranian-food-seed.ts'
      - 'mobile/scripts/generate-iranian-fallback-seed.ts'
      - '.github/workflows/ifkb-iranian-fallback-profiles-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iranian-food-kb-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install locked mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Generate broad DS0 profiles
        working-directory: mobile
        run: |
          npx tsx scripts/generate-iranian-fallback-seed.ts \
            --canon ../ifkb/universal/iranian_canon_v1.csv \
            --output src/data/iranian-fallback-seed.generated.ts \
            --manifest ../ifkb/universal/releases/iranian-fallback-profiles-v1/manifest.json

      - name: Normalize reproducible release metadata
        run: |
          python - <<'PY'
          import json
          path='ifkb/universal/releases/iranian-fallback-profiles-v1/manifest.json'
          manifest=json.load(open(path,encoding='utf-8'))
          manifest['generatedAtUtc']='2026-07-27T00:00:00.000Z'
          with open(path,'w',encoding='utf-8') as handle:
              json.dump(manifest,handle,ensure_ascii=False,indent=2)
              handle.write('\n')
          PY

      - name: Verify scientific state and counts
        run: |
          python - <<'PY'
          import json,re
          manifest=json.load(open('ifkb/universal/releases/iranian-fallback-profiles-v1/manifest.json',encoding='utf-8'))
          generated=open('mobile/src/data/iranian-fallback-seed.generated.ts',encoding='utf-8').read()
          assert manifest['existingSeedCount']==83,manifest
          assert manifest['existingCanonCount']==83,manifest
          assert manifest['broadFallbackCount']==178,manifest
          assert manifest['fallbackCanonCount']==178,manifest
          assert manifest['totalAppReadyCount']==261,manifest
          assert manifest['rules']['verifiedRecordsCreated']==0,manifest
          assert manifest['rules']['replaceableByUserImport'] is False,manifest
          assert manifest['evidenceTier']=='broad_fallback',manifest
          assert manifest['sourceType']=='seeded',manifest
          assert manifest['generatedAtUtc']=='2026-07-27T00:00:00.000Z',manifest
          assert 'portionGrams": null' in generated
          assert 'confidence": "low"' in generated
          assert 'sourceType": "seeded"' in generated
          assert 'IFKB DS0 broad-fallback' in generated
          assert not re.search(r'confidence": "(?:medium|high)"',generated)
          print({
            'existing':manifest['existingSeedCount'],
            'fallback':manifest['broadFallbackCount'],
            'total':manifest['totalAppReadyCount'],
            'categories':len(manifest['priorCategories']),
          })
          PY

      - name: Validate generated TypeScript and domain tests
        working-directory: mobile
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm test
          npm run typecheck

      - name: Commit generated profiles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mobile/src/data/iranian-fallback-seed.generated.ts \
            ifkb/universal/releases/iranian-fallback-profiles-v1/manifest.json
          if git diff --cached --quiet; then
            echo 'Generated profiles are already current.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'data(ifkb): generate Iranian broad-fallback profiles v1'
          git push origin HEAD:agent/iranian-food-kb-foundation

      - uses: actions/upload-artifact@v4
        with:
          name: ifkb-iranian-fallback-profiles-v1
          path: |
            mobile/src/data/iranian-fallback-seed.generated.ts
            ifkb/universal/releases/iranian-fallback-profiles-v1/manifest.json
          if-no-files-found: error
          retention-days: 30
