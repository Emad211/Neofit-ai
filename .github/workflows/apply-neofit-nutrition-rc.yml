name: Clean Nutrition RC Staging Files

on:
  pull_request:
    branches: [agent/iranian-food-kb-foundation]
    paths: ['.github/workflows/apply-neofit-nutrition-rc.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Remove temporary staging payload
        run: |
          git config user.name 'NeoFit Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm -r .github/rc-bundle .github/workflows/apply-neofit-nutrition-rc.yml
          git commit -m 'chore(nutrition): remove temporary RC staging files'
          git push origin HEAD:automation/nutrition-rc-stage9-10
