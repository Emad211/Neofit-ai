name: Fix Food Search Typecheck

on:
  pull_request:
    branches:
      - agent/mobile-local-first-expo
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/diagnose-mobile-typecheck.yml'
      - 'ifkb/dev/diagnose-mobile-typecheck.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iranian-food-kb-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Apply exact TypeScript narrowing fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mobile/app/food-search.tsx')
          text = path.read_text(encoding='utf-8')

          old_external = """      const externalResults: SearchResult[] = universalHits.flatMap((hit) => {\n        if (hit.kind === 'generic_food') {\n          return [{ kind: 'generic', key: `generic:${hit.id}`, hit } satisfies GenericResult];\n        }\n        if (localNames.has(hit.nameFa.toLowerCase()) || localNames.has(hit.nameEn.toLowerCase())) return [];\n        return [{ kind: 'identity', key: `identity:${hit.canonId}`, hit } satisfies IdentityResult];\n      });\n"""
          new_external = """      const externalResults: SearchResult[] = [];\n      for (const hit of universalHits) {\n        if (hit.kind === 'generic_food') {\n          externalResults.push({ kind: 'generic', key: `generic:${hit.id}`, hit });\n          continue;\n        }\n        if (localNames.has(hit.nameFa.toLowerCase()) || localNames.has(hit.nameEn.toLowerCase())) continue;\n        externalResults.push({ kind: 'identity', key: `identity:${hit.canonId}`, hit });\n      }\n"""
          if text.count(old_external) != 1:
              raise SystemExit('external result block did not match exactly once')
          text = text.replace(old_external, new_external)

          old_options = """                options={portions.slice(0, 12).map((portion) => selection.kind === 'generic'\n                  ? {\n                      value: String(portion.id),\n                      label: `${portion.label} · ${portion.gramWeight.toFixed(1)} g`,\n                    }\n                  : {\n                      value: portion.id,\n                      label: `${locale === 'fa' ? portion.labelFa : portion.labelEn}${portion.gramWeight === null ? '' : ` · ${portion.gramWeight.toFixed(1)} g`}`,\n                    })}\n"""
          new_options = """                options={selection.kind === 'generic'\n                  ? selection.details.portions.slice(0, 12).map((portion) => ({\n                      value: String(portion.id),\n                      label: `${portion.label} · ${portion.gramWeight.toFixed(1)} g`,\n                    }))\n                  : selection.variant.portions.slice(0, 12).map((portion) => ({\n                      value: portion.id,\n                      label: `${locale === 'fa' ? portion.labelFa : portion.labelEn}${portion.gramWeight === null ? '' : ` · ${portion.gramWeight.toFixed(1)} g`}`,\n                    }))}\n"""
          if text.count(old_options) != 1:
              raise SystemExit('portion option block did not match exactly once')
          path.write_text(text.replace(old_options, new_options), encoding='utf-8')
          PY
      - name: Validate fixed mobile code
        working-directory: mobile
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm ci --no-audit --no-fund > /tmp/npm-ci.log 2>&1 || { cat /tmp/npm-ci.log; exit 1; }
          npm test > /tmp/npm-test.log 2>&1 || { cat /tmp/npm-test.log; exit 1; }
          npm run typecheck
      - name: Remove temporary diagnostic files
        run: |
          rm -f ifkb/dev/diagnose-mobile-typecheck.trigger
          rm -f .github/workflows/diagnose-mobile-typecheck.yml
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(nutrition): narrow comprehensive search result unions'
          git push origin HEAD:agent/iranian-food-kb-foundation
