name: IFKB Openverse Exact Commons v0.12

on:
  pull_request:
    branches:
      - agent/mobile-local-first-expo
    types: [opened, synchronize, reopened]
    paths:
      - 'ifkb/images/openverse_exact_commons_queries_v0.12.csv'
      - '.github/workflows/ifkb-openverse-exact-commons-v012.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ifkb-openverse-exact-v012
  cancel-in-progress: false

jobs:
  acquire-exact-thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Discover exact-title candidates through Openverse
        run: |
          python ifkb/images/discover_openverse_candidates.py \
            --queries ifkb/images/openverse_exact_commons_queries_v0.12.csv \
            --output build/ifkb-openverse-exact-v0.12 \
            --max-per-class 3

      - name: Verify candidate output
        run: |
          test -s build/ifkb-openverse-exact-v0.12/candidate_manifest.csv
          test -s build/ifkb-openverse-exact-v0.12/class_summary.csv
          test -s build/ifkb-openverse-exact-v0.12/dataset_manifest.json

      - name: Upload exact-title candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ifkb-openverse-exact-v0.12
          path: build/ifkb-openverse-exact-v0.12
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
