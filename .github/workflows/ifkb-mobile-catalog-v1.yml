name: IFKB Universal Mobile Catalog v1

on:
  push:
    branches:
      - agent/iranian-food-kb-foundation
    paths:
      - 'ifkb/universal/build_mobile_catalog.py'
      - 'ifkb/universal/augment_mobile_catalog_concepts.py'
      - 'ifkb/universal/import_sr_legacy_app_layer.py'
      - 'ifkb/universal/import_fndds_app_layer.py'
      - 'ifkb/universal/iranian_canon_v1.csv'
      - 'ifkb/universal/persian_search_aliases_v1.csv'
      - '.github/workflows/ifkb-mobile-catalog-v1.yml'
  workflow_dispatch:

env:
  IFKB_CATALOG_VERSION: '1.2.0'

permissions:
  contents: write

concurrency:
  group: ifkb-universal-mobile-catalog-v1
  cancel-in-progress: true

jobs:
  build-mobile-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iranian-food-kb-foundation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Build official USDA source layers
        run: |
          python ifkb/universal/import_sr_legacy_app_layer.py \
            --output build/ifkb-sr-legacy
          python ifkb/universal/import_fndds_app_layer.py \
            --output build/ifkb-fndds

      - name: Build immutable mobile catalog
        run: |
          mkdir -p mobile/assets/ifkb
          python ifkb/universal/build_mobile_catalog.py \
            --sr-db build/ifkb-sr-legacy/sr_legacy_app_layer.sqlite \
            --fndds-db build/ifkb-fndds/fndds_2021_2023_app_layer.sqlite \
            --iranian-canon ifkb/universal/iranian_canon_v1.csv \
            --persian-aliases ifkb/universal/persian_search_aliases_v1.csv \
            --output mobile/assets/ifkb/ifkb-universal-v1.db \
            --manifest mobile/assets/ifkb/ifkb-universal-v1.manifest.json \
            --version "$IFKB_CATALOG_VERSION"

      - name: Build conservative generic Concept and Variant mappings
        run: |
          python ifkb/universal/augment_mobile_catalog_concepts.py \
            --database mobile/assets/ifkb/ifkb-universal-v1.db \
            --manifest mobile/assets/ifkb/ifkb-universal-v1.manifest.json

      - name: Verify catalog counts, search, concepts, micronutrients, and integrity
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          root=Path('mobile/assets/ifkb')
          manifest=json.loads((root/'ifkb-universal-v1.manifest.json').read_text())
          db=sqlite3.connect(root/'ifkb-universal-v1.db')
          integrity=db.execute('PRAGMA integrity_check').fetchone()[0]
          foods=db.execute('SELECT COUNT(*) FROM generic_foods').fetchone()[0]
          portions=db.execute('SELECT COUNT(*) FROM generic_portions').fetchone()[0]
          concepts=db.execute('SELECT COUNT(*) FROM generic_concepts').fetchone()[0]
          variants=db.execute('SELECT COUNT(*) FROM generic_variants').fetchone()[0]
          clustered=db.execute('SELECT COUNT(*) FROM generic_concepts WHERE variant_count>1').fetchone()[0]
          multi_source=db.execute('SELECT COUNT(*) FROM generic_concepts WHERE source_type_count>1').fetchone()[0]
          orphan_foods=db.execute('''SELECT COUNT(*) FROM generic_foods f
            LEFT JOIN generic_variants v ON v.food_id=f.id WHERE v.food_id IS NULL''').fetchone()[0]
          orphan_variants=db.execute('''SELECT COUNT(*) FROM generic_variants v
            LEFT JOIN generic_concepts c ON c.id=v.concept_id WHERE c.id IS NULL''').fetchone()[0]
          canon=db.execute('SELECT COUNT(*) FROM iranian_canon').fetchone()[0]
          aliases=db.execute('SELECT COUNT(*) FROM persian_search_aliases').fetchone()[0]
          complete=db.execute('SELECT COUNT(*) FROM generic_foods WHERE macro_completeness=1').fetchone()[0]
          calcium=db.execute('SELECT COUNT(*) FROM generic_foods WHERE calcium_mg IS NOT NULL').fetchone()[0]
          iron=db.execute('SELECT COUNT(*) FROM generic_foods WHERE iron_mg IS NOT NULL').fetchone()[0]
          potassium=db.execute('SELECT COUNT(*) FROM generic_foods WHERE potassium_mg IS NOT NULL').fetchone()[0]
          vitamin_c=db.execute('SELECT COUNT(*) FROM generic_foods WHERE vitamin_c_mg IS NOT NULL').fetchone()[0]
          white=db.execute("SELECT COUNT(*) FROM generic_food_search WHERE generic_food_search MATCH 'egg AND white'").fetchone()[0]
          yolk=db.execute("SELECT COUNT(*) FROM generic_food_search WHERE generic_food_search MATCH 'egg AND yolk'").fetchone()[0]
          tomato=db.execute("SELECT COUNT(*) FROM generic_food_search WHERE generic_food_search MATCH 'tomatoes AND raw'").fetchone()[0]
          salad=db.execute("SELECT COUNT(*) FROM generic_food_search WHERE generic_food_search MATCH 'salad'").fetchone()[0]
          pizza=db.execute("SELECT COUNT(*) FROM generic_food_search WHERE generic_food_search MATCH 'pizza'").fetchone()[0]
          concept_egg=db.execute("SELECT COUNT(*) FROM generic_concept_search WHERE generic_concept_search MATCH 'egg AND white'").fetchone()[0]
          ghormeh=db.execute("SELECT COUNT(*) FROM iranian_food_search WHERE iranian_food_search MATCH 'قورمه سبزی'").fetchone()[0]
          db.close()
          assert integrity=='ok',integrity
          assert manifest['version']=='1.2.0',manifest
          assert foods==13225,(foods,manifest)
          assert portions==36494,portions
          assert variants==foods,(variants,foods)
          assert manifest['genericVariantMappingCoverage']==1,manifest
          assert concepts < foods,(concepts,foods)
          assert clustered>0,clustered
          assert multi_source>0,multi_source
          assert orphan_foods==0,orphan_foods
          assert orphan_variants==0,orphan_variants
          assert canon==261,canon
          assert aliases==218,aliases
          assert complete>=13224,complete
          assert calcium>10000,calcium
          assert iron>10000,iron
          assert potassium>10000,potassium
          assert vitamin_c>9000,vitamin_c
          assert all(value>0 for value in (white,yolk,tomato,salad,pizza,concept_egg,ghormeh)),(white,yolk,tomato,salad,pizza,concept_egg,ghormeh)
          assert manifest['databaseBytes'] < 30*1024*1024,manifest['databaseBytes']
          print({
            'foods':foods,'portions':portions,'concepts':concepts,'variants':variants,
            'clusteredConcepts':clustered,'multiSourceConcepts':multi_source,
            'canon':canon,'aliases':aliases,'completeMacros':complete,
            'calcium':calcium,'iron':iron,'potassium':potassium,'vitaminC':vitamin_c,
            'bytes':manifest['databaseBytes']
          })
          PY

      - name: Install locked mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Check Expo asset dependency
        working-directory: mobile
        run: npx expo install --check

      - name: Commit generated mobile catalog
        run: |
          rm -rf build/ifkb-sr-legacy build/ifkb-fndds
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/assets/ifkb
          if git diff --cached --quiet; then
            echo 'Catalog already current.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'data(ifkb): bundle generic concepts catalog v1.2'
          git pull --rebase origin agent/iranian-food-kb-foundation
          git push origin HEAD:agent/iranian-food-kb-foundation

      - uses: actions/upload-artifact@v4
        with:
          name: ifkb-universal-mobile-catalog-v1.2
          path: |
            mobile/assets/ifkb/ifkb-universal-v1.db
            mobile/assets/ifkb/ifkb-universal-v1.manifest.json
          if-no-files-found: error
          retention-days: 30
