name: Workout Player Persistence CI

on:
  push:
    branches:
      - 'stage6/**'
    paths:
      - 'web/components/workout-player.tsx'
      - 'web/components/workout-details-screen.tsx'
      - 'web/app/workout-player/**'
      - 'web/app/workout-player.css'
      - 'web/lib/workout-*.ts'
      - 'web/lib/supabase/workout-identity.ts'
      - 'web/lib/supabase/database.types.ts'
      - 'web/tests/workout-player-persistence.test.ts'
      - 'web/package.json'
      - 'supabase/migrations/*workout*.sql'
      - 'docs/NEOFIT_WORKOUT_PLAYER_PERSISTENCE.md'
      - '.github/workflows/workout-player-ci.yml'
  pull_request:
    branches:
      - stage5/ai-provider-foundation
      - web/full-frontend-integration
    paths:
      - 'web/components/workout-player.tsx'
      - 'web/components/workout-details-screen.tsx'
      - 'web/app/workout-player/**'
      - 'web/app/workout-player.css'
      - 'web/lib/workout-*.ts'
      - 'web/lib/supabase/workout-identity.ts'
      - 'web/lib/supabase/database.types.ts'
      - 'web/tests/workout-player-persistence.test.ts'
      - 'web/package.json'
      - 'supabase/migrations/*workout*.sql'
      - 'docs/NEOFIT_WORKOUT_PLAYER_PERSISTENCE.md'
      - '.github/workflows/workout-player-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workout-player-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: |
            web/package.json
            packages/nutrition-core/package.json

      - name: Install workspace dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Workout persistence contract tests
        working-directory: web
        run: npm run test:workout-player

      - name: TypeScript
        working-directory: web
        run: npm run typecheck

      - name: Production build
        working-directory: web
        run: npm run build

      - name: Verify database ownership contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=supabase/migrations/20260808170000_workout_session_persistence.sql
          test -s "$FILE"
          grep -q 'workout_sessions' "$FILE"
          grep -q 'workout_sets' "$FILE"
          grep -q 'foreign key (session_id, user_id)' "$FILE"
          grep -q 'enable row level security' "$FILE"
          grep -q 'auth.uid()' "$FILE"
          grep -q 'to authenticated' "$FILE"
