name: Nutrition Core CI

on:
  push:
    branches:
      - 'stage3/**'
    paths:
      - 'packages/nutrition-core/**'
      - 'docs/NEOFIT_NUTRITION_CORE_AUTHORITY_MAP.md'
      - 'docs/NEOFIT_SEARCH_RANKING_AUTHORITY_MAP.md'
      - 'docs/NEOFIT_CATALOG_PROVENANCE_AUTHORITY_MAP.md'
      - 'docs/NEOFIT_UNIVERSAL_ESTIMATE_SQLITE_AUTHORITY_MAP.md'
      - 'docs/NEOFIT_MASTER_PLAN.md'
      - 'docs/NEOFIT_PROGRESS_LOG.md'
      - '.github/workflows/nutrition-core-ci.yml'
  pull_request:
    branches:
      - web/pwa-foundation
    paths:
      - 'packages/nutrition-core/**'
      - 'docs/NEOFIT_NUTRITION_CORE_AUTHORITY_MAP.md'
      - 'docs/NEOFIT_SEARCH_RANKING_AUTHORITY_MAP.md'
      - 'docs/NEOFIT_CATALOG_PROVENANCE_AUTHORITY_MAP.md'
      - 'docs/NEOFIT_UNIVERSAL_ESTIMATE_SQLITE_AUTHORITY_MAP.md'
      - 'docs/NEOFIT_MASTER_PLAN.md'
      - 'docs/NEOFIT_PROGRESS_LOG.md'
      - '.github/workflows/nutrition-core-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nutrition-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: packages/nutrition-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: packages/nutrition-core/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Initialize evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '{"commit":"%s","status":"preflight"}\n' "$GITHUB_SHA" > artifacts/preflight.json

      - name: Verify golden provenance
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/NEOFIT_NUTRITION_CORE_AUTHORITY_MAP.md
          test -s docs/NEOFIT_SEARCH_RANKING_AUTHORITY_MAP.md
          test -s docs/NEOFIT_CATALOG_PROVENANCE_AUTHORITY_MAP.md
          test -s docs/NEOFIT_UNIVERSAL_ESTIMATE_SQLITE_AUTHORITY_MAP.md
          test -s packages/nutrition-core/tests/mobile-rc-golden-v1.ts
          test -s packages/nutrition-core/tests/search-ranking-golden-v1.ts
          test -s packages/nutrition-core/tests/catalog-provenance-golden-v1.ts
          test -s packages/nutrition-core/tests/catalog-provenance-parity.test.ts
          test -s packages/nutrition-core/tests/universal-estimate-golden-v1.ts
          test -s packages/nutrition-core/tests/universal-estimate-sqlite-parity.test.ts
          grep -q '648b98cdc921beb26ccd0ff05a1f17944bb6f71d' packages/nutrition-core/tests/mobile-rc-golden-v1.ts
          grep -q '2291e1958efe5e17010230c5864c9fadc9bc47ba' packages/nutrition-core/tests/mobile-rc-golden-v1.ts
          grep -q '24a1d20effe679b23e4ee4966d0bdb01f2b06ec0' packages/nutrition-core/tests/search-ranking-golden-v1.ts
          grep -q 'd43931525ade2f1b685b18647d1554cc317f14bd8874ed66fe5c85370454fbde' packages/nutrition-core/tests/search-ranking-golden-v1.ts
          grep -q 'contract_only_not_released' packages/nutrition-core/tests/search-ranking-golden-v1.ts
          grep -q 'f6bcc7bbeeed078b2798b625591b08a11bce0b78' packages/nutrition-core/tests/catalog-provenance-golden-v1.ts
          grep -q '1afb7266b7d456530febb5c1c49c109e3d1f3ef7' packages/nutrition-core/tests/catalog-provenance-golden-v1.ts
          grep -q '1edb7e8eed151305075e634a84596db2211dffaf' packages/nutrition-core/tests/catalog-provenance-golden-v1.ts
          grep -q '30fcc0d774a43f0f0608bd29c342c3e20d339f58' packages/nutrition-core/tests/catalog-provenance-golden-v1.ts
          grep -q 'candidate-not-final' packages/nutrition-core/tests/catalog-provenance-golden-v1.ts
          grep -q '7f54426e0b6838700f09b831c7df5a94afef8361' packages/nutrition-core/tests/universal-estimate-golden-v1.ts
          grep -q 'cdfacc1eafba4267cdc793284462bbabd7ca93b5' packages/nutrition-core/tests/universal-estimate-golden-v1.ts
          grep -q '80538220517f8b4f0bc80117469b16f6a82c7bdf' packages/nutrition-core/tests/universal-estimate-golden-v1.ts
          grep -q 'fndds: 0.15' packages/nutrition-core/tests/universal-estimate-golden-v1.ts
          grep -q 'sr_legacy: 0.08' packages/nutrition-core/tests/universal-estimate-golden-v1.ts

      - name: Verify pure-domain boundary
        run: npm run boundary

      - name: TypeScript
        run: npm run typecheck

      - name: Mobile and IFKB parity tests
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test --test-reporter=tap tests/*.test.ts | tee artifacts/parity.tap

      - name: Write parity metadata
        shell: bash
        run: |
          set -euo pipefail
          printf '{\n  "package": "@neofit/nutrition-core",\n  "schemaVersion": 1,\n  "commit": "%s",\n  "referenceBranch": "agent/iranian-food-kb-foundation",\n  "referenceHead": "648b98cdc921beb26ccd0ff05a1f17944bb6f71d",\n  "sourceTestBlob": "2291e1958efe5e17010230c5864c9fadc9bc47ba",\n  "searchBlob": "bb99c934beeed5094da7e0a29a8f53635ace48b3",\n  "rankingBlob": "9b23b1ef7d6817ff2b946e1fdedcad76608279e1",\n  "controlledSearchRelease": "1.1.0",\n  "controlledSearchManifestBlob": "24a1d20effe679b23e4ee4966d0bdb01f2b06ec0",\n  "controlledSearchArtifactDigest": "sha256:d43931525ade2f1b685b18647d1554cc317f14bd8874ed66fe5c85370454fbde",\n  "naturalQueryCorpus": "not_released",\n  "catalogReleaseVersion": "1.2.0",\n  "catalogManifestBlob": "f6bcc7bbeeed078b2798b625591b08a11bce0b78",\n  "catalogWorkflowBlob": "1012754613cf99bd3c73de49830731e9cc52adcf",\n  "catalogBuilderBlob": "597180d6bd540bc9b8bf0fc931c030d534289f5c",\n  "catalogReleaseProjectionBlob": "1afb7266b7d456530febb5c1c49c109e3d1f3ef7",\n  "catalogProvenanceBlob": "1edb7e8eed151305075e634a84596db2211dffaf",\n  "legacyCatalogAdapterBlob": "30fcc0d774a43f0f0608bd29c342c3e20d339f58",\n  "schemaIdCandidateStatus": "candidate-not-final",\n  "schemaIdCandidateDocumentBlob": "0f372496cbad2ecf5cca72a6fdf7604255179be0",\n  "nutritionRcFreezeDocumentBlob": "3c0601f469c6d15618fcadd1179c16c581da6f6e",\n  "universalEstimateBlob": "7f54426e0b6838700f09b831c7df5a94afef8361",\n  "universalRepositoryBlob": "cdfacc1eafba4267cdc793284462bbabd7ca93b5",\n  "sqliteEquivalenceTestBlob": "80538220517f8b4f0bc80117469b16f6a82c7bdf",\n  "fnddsUncertainty": 0.15,\n  "srLegacyUncertainty": 0.08,\n  "sqliteRuntimeBoundary": "test-only",\n  "generatedAt": "%s"\n}\n' \
            "$GITHUB_SHA" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > artifacts/parity-metadata.json
          cat artifacts/parity-metadata.json

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neofit-nutrition-core-parity
          path: packages/nutrition-core/artifacts
          if-no-files-found: error
          retention-days: 30
