name: IFKB Pilot Image Acquisition

on:
  pull_request:
    branches:
      - agent/mobile-local-first-expo
    types: [opened, synchronize, reopened]
    paths:
      - 'ifkb/images/**'
      - '.github/workflows/ifkb-pilot-image-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-licensed-pilot-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Download and audit Wikimedia Commons images
        run: |
          python ifkb/images/download_commons_images.py \
            --manifest ifkb/images/pilot_seed_manifest.csv \
            --output build/ifkb-pilot-images-v0.10

      - name: Verify resolved manifest exists
        run: |
          test -s build/ifkb-pilot-images-v0.10/resolved_manifest.csv
          test -s build/ifkb-pilot-images-v0.10/ATTRIBUTION.md
          test -s build/ifkb-pilot-images-v0.10/dataset_manifest.json

      - name: Upload licensed image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ifkb-pilot-images-v0.10
          path: build/ifkb-pilot-images-v0.10
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
