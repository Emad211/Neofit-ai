name: IFKB Pilot Image Acquisition

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ifkb-wikimedia-commons
  cancel-in-progress: false

jobs:
  acquire-licensed-pilot-images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Download and audit Wikimedia Commons images
        id: acquire
        continue-on-error: true
        run: |
          python ifkb/images/download_commons_images_curl.py \
            --manifest ifkb/images/pilot_seed_manifest.csv \
            --output build/ifkb-pilot-images-v0.10

      - name: Upload partial or complete audited artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ifkb-pilot-images-v0.10
          path: build/ifkb-pilot-images-v0.10
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Enforce complete acquisition
        if: always()
        run: |
          test -s build/ifkb-pilot-images-v0.10/resolved_manifest.csv
          test -s build/ifkb-pilot-images-v0.10/ATTRIBUTION.md
          test -s build/ifkb-pilot-images-v0.10/dataset_manifest.json
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('build/ifkb-pilot-images-v0.10')
          manifest = json.loads((root / 'dataset_manifest.json').read_text())
          failures = list(csv.DictReader((root / 'failures.csv').open()))
          print(json.dumps(manifest, indent=2))
          if failures or manifest['downloaded'] != manifest['requested']:
              raise SystemExit(f"incomplete acquisition: {len(failures)} failures")
          PY
