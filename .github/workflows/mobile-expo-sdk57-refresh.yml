name: Mobile Expo SDK 57 One-Shot Lock Refresh

on:
  push:
    branches:
      - agent/iranian-food-kb-foundation
    paths:
      - '.github/workflows/mobile-expo-sdk57-refresh.yml'

permissions:
  contents: write

concurrency:
  group: mobile-expo-sdk57-one-shot
  cancel-in-progress: false

jobs:
  refresh-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iranian-food-kb-foundation
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install current locked dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Refresh Expo-compatible patch versions and lockfile
        working-directory: mobile
        run: npx expo install --fix

      - name: Verify refreshed compatibility
        working-directory: mobile
        run: npx expo install --check

      - name: Remove this one-shot workflow and commit generated lock
        run: |
          rm .github/workflows/mobile-expo-sdk57-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json .github/workflows/mobile-expo-sdk57-refresh.yml
          git diff --cached --check
          git commit -m "chore(mobile): refresh Expo SDK 57 compatible lockfile"
          git push origin HEAD:agent/iranian-food-kb-foundation
