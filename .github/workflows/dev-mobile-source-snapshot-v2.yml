name: Dev Mobile Source Snapshot v2

on:
  pull_request:
    branches:
      - agent/mobile-local-first-expo
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/dev-mobile-source-snapshot-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build current mobile source snapshot
        run: |
          mkdir -p snapshot
          tar \
            --exclude='mobile/node_modules' \
            --exclude='mobile/.expo' \
            --exclude='mobile/dist' \
            -czf snapshot/neofit-mobile-current.tar.gz mobile
          find mobile -type f | sort > snapshot/file-list.txt
      - uses: actions/upload-artifact@v4
        with:
          name: neofit-mobile-current-source
          path: snapshot
          if-no-files-found: error
          retention-days: 1
