name: Apply Recipe Route And Meal Type

on:
  pull_request:
    branches:
      - agent/mobile-local-first-expo
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apply-recipe-route-and-meal-type.yml'
      - 'ifkb/dev/apply-recipe-route-and-meal-type.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iranian-food-kb-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Patch recipe navigation and meal type
        run: |
          python - <<'PY'
          from pathlib import Path

          recipes = Path('mobile/app/recipes.tsx')
          text = recipes.read_text(encoding='utf-8')
          old = "import type { FoodConcept, FoodVariant, RecipeCalculationResult } from '@/nutrition-core';"
          new = "import type { FoodConcept, FoodVariant, MealType, RecipeCalculationResult } from '@/nutrition-core';"
          if text.count(old) != 1:
              raise SystemExit('recipe type import anchor mismatch')
          text = text.replace(old, new)
          old = "  const [cookedYield, setCookedYield] = React.useState('');\n"
          new = "  const [cookedYield, setCookedYield] = React.useState('');\n  const [recipeMealType, setRecipeMealType] = React.useState<MealType>('lunch');\n"
          if text.count(old) != 1:
              raise SystemExit('recipe meal state anchor mismatch')
          text = text.replace(old, new)
          if text.count("        mealType: 'lunch',") != 1:
              raise SystemExit('hard-coded lunch anchor mismatch')
          text = text.replace("        mealType: 'lunch',", "        mealType: recipeMealType,")
          old = """          {calculationCards(preview.calculation, label)}\n          <PrimaryButton title={label('Log one serving to Diary', 'ثبت یک سهم در دفتر')} onPress={logServing} loading={logging} />\n"""
          new = """          {calculationCards(preview.calculation, label)}\n          <AppText weight=\"700\">{label('Meal type', 'نوع وعده')}</AppText>\n          <ChoiceGrid\n            value={recipeMealType}\n            onChange={setRecipeMealType}\n            columns={2}\n            options={[\n              { value: 'breakfast', label: label('Breakfast', 'صبحانه') },\n              { value: 'lunch', label: label('Lunch', 'ناهار') },\n              { value: 'dinner', label: label('Dinner', 'شام') },\n              { value: 'snack', label: label('Snack', 'میان‌وعده') },\n            ]}\n          />\n          <PrimaryButton title={label('Log one serving to Diary', 'ثبت یک سهم در دفتر')} onPress={logServing} loading={logging} />\n"""
          if text.count(old) != 1:
              raise SystemExit('recipe preview anchor mismatch')
          recipes.write_text(text.replace(old, new), encoding='utf-8')

          layout = Path('mobile/app/_layout.tsx')
          text = layout.read_text(encoding='utf-8')
          old = '      <Stack.Screen name="nutrition-diary" options={{ title: direction === \'rtl\' ? \'دفتر تغذیه\' : \'Nutrition diary\' }} />\n'
          new = old + '      <Stack.Screen name="recipes" options={{ title: direction === \'rtl\' ? \'دستورهای غذایی\' : \'Recipes\' }} />\n'
          if text.count(old) != 1:
              raise SystemExit('layout recipe anchor mismatch')
          layout.write_text(text.replace(old, new), encoding='utf-8')

          nutrition = Path('mobile/app/(tabs)/nutrition.tsx')
          text = nutrition.read_text(encoding='utf-8')
          old = """        <PrimaryButton\n          title={label('Open today’s diary', 'بازکردن دفتر امروز')}\n          variant=\"secondary\"\n          onPress={() => router.push('/nutrition-diary')}\n        />\n"""
          new = old + """        <PrimaryButton\n          title={label('Open recipes', 'بازکردن دستورهای غذایی')}\n          variant=\"secondary\"\n          onPress={() => router.push('/recipes')}\n        />\n"""
          if text.count(old) != 1:
              raise SystemExit('nutrition recipe button anchor mismatch')
          nutrition.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Validate recipe integration
        working-directory: mobile
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm ci --no-audit --no-fund > /tmp/npm-ci.log 2>&1 || { cat /tmp/npm-ci.log; exit 1; }
          npm test > /tmp/npm-test.log 2>&1 || { cat /tmp/npm-test.log; exit 1; }
          npm run typecheck
      - name: Remove temporary files
        run: |
          rm -f ifkb/dev/apply-recipe-route-and-meal-type.trigger
          rm -f .github/workflows/apply-recipe-route-and-meal-type.yml
      - name: Commit verified recipe integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(nutrition): expose deterministic recipe builder'
          git push origin HEAD:agent/iranian-food-kb-foundation
