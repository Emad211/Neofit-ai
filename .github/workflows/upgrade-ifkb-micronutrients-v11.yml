name: Upgrade IFKB Micronutrients v1.1

on:
  pull_request:
    branches:
      - agent/mobile-local-first-expo
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/upgrade-ifkb-micronutrients-v11.yml'
      - 'ifkb/dev/upgrade-ifkb-micronutrients-v11.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upgrade-ifkb-micronutrients-v11
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iranian-food-kb-foundation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Patch official importers, catalog schema, and runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ifkb/dev/upgrade_ifkb_micros_v11.py')
          source = path.read_text(encoding='utf-8')
          marker = "\nworkflow = '.github/workflows/ifkb-mobile-catalog-v1.yml'\n"
          parts = source.split(marker, 1)
          if len(parts) != 2:
              raise SystemExit('Permanent workflow patch marker was not found exactly once.')
          exec(compile(parts[0] + "\nprint('micronutrient data/runtime patch applied')\n", str(path), 'exec'))
          PY

      - name: Build upgraded official USDA layers and mobile catalog
        run: |
          rm -rf build/ifkb-sr-legacy build/ifkb-fndds
          python ifkb/universal/import_sr_legacy_app_layer.py --output build/ifkb-sr-legacy
          python ifkb/universal/import_fndds_app_layer.py --output build/ifkb-fndds
          python ifkb/universal/build_mobile_catalog.py \
            --sr-db build/ifkb-sr-legacy/sr_legacy_app_layer.sqlite \
            --fndds-db build/ifkb-fndds/fndds_2021_2023_app_layer.sqlite \
            --iranian-canon ifkb/universal/iranian_canon_v1.csv \
            --persian-aliases ifkb/universal/persian_search_aliases_v1.csv \
            --output mobile/assets/ifkb/ifkb-universal-v1.db \
            --manifest mobile/assets/ifkb/ifkb-universal-v1.manifest.json \
            --version 1.1.0

      - name: Verify upgraded catalog
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          root=Path('mobile/assets/ifkb')
          manifest=json.loads((root/'ifkb-universal-v1.manifest.json').read_text())
          db=sqlite3.connect(root/'ifkb-universal-v1.db')
          values={
            'integrity':db.execute('PRAGMA integrity_check').fetchone()[0],
            'foods':db.execute('SELECT COUNT(*) FROM generic_foods').fetchone()[0],
            'portions':db.execute('SELECT COUNT(*) FROM generic_portions').fetchone()[0],
            'calcium':db.execute('SELECT COUNT(*) FROM generic_foods WHERE calcium_mg IS NOT NULL').fetchone()[0],
            'iron':db.execute('SELECT COUNT(*) FROM generic_foods WHERE iron_mg IS NOT NULL').fetchone()[0],
            'potassium':db.execute('SELECT COUNT(*) FROM generic_foods WHERE potassium_mg IS NOT NULL').fetchone()[0],
            'vitaminC':db.execute('SELECT COUNT(*) FROM generic_foods WHERE vitamin_c_mg IS NOT NULL').fetchone()[0],
          }
          db.close()
          assert values['integrity']=='ok',values
          assert values['foods']==13225,values
          assert values['portions']==36494,values
          assert values['calcium']>10000,values
          assert values['iron']>10000,values
          assert values['potassium']>10000,values
          assert values['vitaminC']>9000,values
          assert manifest['version']=='1.1.0',manifest
          assert manifest['databaseBytes'] < 24*1024*1024,manifest
          Path('/tmp/ifkb-micro-upgrade').mkdir(parents=True,exist_ok=True)
          Path('/tmp/ifkb-micro-upgrade/verified-catalog.json').write_text(
            json.dumps({'manifest':manifest,'coverage':values},indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'manifest':manifest,'coverage':values},indent=2))
          PY

      - name: Validate mobile runtime
        working-directory: mobile
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm ci --no-audit --no-fund > /tmp/npm-ci.log 2>&1 || { cat /tmp/npm-ci.log; exit 1; }
          npm test > /tmp/npm-test.log 2>&1 || { cat /tmp/npm-test.log; exit 1; }
          npm run typecheck

      - name: Remove temporary files
        run: |
          rm -rf build/ifkb-sr-legacy build/ifkb-fndds
          rm -f ifkb/dev/upgrade-ifkb-micronutrients-v11.trigger
          rm -f ifkb/dev/upgrade_ifkb_micros_v11.py
          rm -f .github/workflows/upgrade-ifkb-micronutrients-v11.yml

      - name: Commit, rebase, and push verified upgrade
        id: publish
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/ifkb-micro-upgrade
          status=0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short > /tmp/ifkb-micro-upgrade/git-status-before-commit.txt
          git diff --cached --check > /tmp/ifkb-micro-upgrade/diff-check.log 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            git commit -m 'data(ifkb): add calcium iron potassium and vitamin C' > /tmp/ifkb-micro-upgrade/commit.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            git fetch origin agent/iranian-food-kb-foundation > /tmp/ifkb-micro-upgrade/fetch.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            git rebase origin/agent/iranian-food-kb-foundation > /tmp/ifkb-micro-upgrade/rebase.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            git push origin HEAD:agent/iranian-food-kb-foundation > /tmp/ifkb-micro-upgrade/push.log 2>&1 || status=$?
          fi
          printf '%s\n' "$status" > /tmp/ifkb-micro-upgrade/status.txt
          exit 0

      - name: Upload publication diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ifkb-micronutrient-v11-publication
          path: /tmp/ifkb-micro-upgrade
          if-no-files-found: error
          retention-days: 2

      - name: Enforce publication result
        run: test "$(cat /tmp/ifkb-micro-upgrade/status.txt)" = "0"
