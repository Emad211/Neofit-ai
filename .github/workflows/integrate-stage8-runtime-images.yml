name: Integrate Stage 8 Runtime Images

on:
  pull_request:
    branches:
      - agent/iranian-food-kb-foundation
    paths:
      - '.github/stage8-build/**'
      - '.github/workflows/integrate-stage8-runtime-images.yml'

permissions:
  contents: write

concurrency:
  group: integrate-stage8-runtime-images
  cancel-in-progress: false

jobs:
  build-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Verify and unpack temporary builder
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/stage8-build/bundle.b64 > /tmp/stage8-build-bundle.zip
          echo '9ae051c80accfa6ea307dd251dbb1d409a3dc6567ccc19215488f1d7644fb4a4  /tmp/stage8-build-bundle.zip' | sha256sum --check --strict
          rm -rf /tmp/stage8-builder
          mkdir -p /tmp/stage8-builder
          unzip -q /tmp/stage8-build-bundle.zip -d /tmp/stage8-builder
          python -m py_compile /tmp/stage8-builder/build_stage8.py
          python -m json.tool /tmp/stage8-builder/sources.json >/dev/null

      - name: Build bundled licensed images and explicit placeholders
        run: |
          python /tmp/stage8-builder/build_stage8.py \
            "$GITHUB_WORKSPACE" \
            --sources /tmp/stage8-builder/sources.json

      - name: Inspect generated image contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(find mobile/assets/ifkb/food-images/stage8/primary -type f -name '*.jpg' | wc -l)" -eq 24
          test "$(find mobile/assets/ifkb/food-images/stage8/placeholders -type f -name '*.jpg' | wc -l)" -eq 9
          test -s mobile/src/data/iranian-food-image-catalog.ts
          test -s mobile/data/ifkb/releases/0.19.0-stage8/manifest.json
          test -s mobile/data/ifkb/releases/0.19.0-stage8/ATTRIBUTION.md
          git diff --check

      - name: Install locked mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Run deterministic tests
        working-directory: mobile
        run: npm test

      - name: Validate TypeScript and Expo
        working-directory: mobile
        run: |
          npx expo install --check
          npm run doctor
          npm run typecheck

      - name: Export Android bundle with Metro image resolution
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist

      - name: Commit only tested product changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/stage8-build
          rm -f .github/workflows/integrate-stage8-runtime-images.yml
          rm -rf build mobile/dist
          git config user.name 'NeoFit Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No Stage 8 product changes were produced.' >&2
            exit 1
          fi
          git commit -m 'feat(nutrition): integrate licensed Stage 8 food images'
          git push origin HEAD:${{ github.head_ref }}
