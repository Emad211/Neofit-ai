name: Apply Concept Parser Identity Refinement

on:
  pull_request:
    branches:
      - agent/mobile-local-first-expo
    types: [opened, synchronize, reopened]
    paths:
      - 'ifkb/universal/patch_concept_parser_identity.py'
      - '.github/workflows/apply-concept-parser-identity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iranian-food-kb-foundation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply focused parser refinement
        run: python ifkb/universal/patch_concept_parser_identity.py

      - name: Verify identity examples
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('concepts','ifkb/universal/augment_mobile_catalog_concepts.py')
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          cases={
            'Pork, fresh, backfat, raw':'Pork, fresh, backfat',
            'Beverages, Cranberry juice cocktail':'Beverages, Cranberry juice cocktail',
            'Beverages, Orange juice, concentrate, frozen':'Beverages, Orange juice, concentrate',
            'Egg, white, raw, fresh':'Egg, white',
          }
          for source,expected in cases.items():
              result=module.parse_description(source)
              assert result['concept_name']==expected,(source,result,expected)
              print(source,'=>',result['concept_name'])
          PY

      - name: Remove temporary transport
        run: |
          rm -f ifkb/universal/patch_concept_parser_identity.py
          rm -f .github/workflows/apply-concept-parser-identity.yml

      - name: Commit parser refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ifkb): preserve meat cuts and beverage identities in concept mapping'
          git push origin HEAD:agent/iranian-food-kb-foundation
