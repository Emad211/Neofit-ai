name: Onboarding v2 Lifecycle CI

on:
  push:
    branches:
      - 'stage21/**'
    paths:
      - 'web/app/onboarding/**'
      - 'web/app/page.tsx'
      - 'web/app/api/ai/providers/**'
      - 'web/components/onboarding/**'
      - 'web/lib/onboarding/**'
      - 'web/lib/ai/**'
      - 'web/tests/onboarding-foundation.test.ts'
      - 'web/tests/ai-provider-foundation.test.ts'
      - 'web/lib/supabase/database.types.ts'
      - 'web/package.json'
      - 'supabase/migrations/*onboarding*.sql'
      - 'supabase/migrations/*provider_credentials*.sql'
      - 'docs/NEOFIT_STAGE21_ONBOARDING_SELF_REPORT_V2.md'
      - 'docs/NEOFIT_COACH_PROGRAM_LIFECYCLE_ARCHITECTURE.md'
      - '.github/workflows/onboarding-ci.yml'
  pull_request:
    branches:
      - stage20/ui-truth-empty-states
    paths:
      - 'web/app/onboarding/**'
      - 'web/app/page.tsx'
      - 'web/app/api/ai/providers/**'
      - 'web/components/onboarding/**'
      - 'web/lib/onboarding/**'
      - 'web/lib/ai/**'
      - 'web/tests/onboarding-foundation.test.ts'
      - 'web/tests/ai-provider-foundation.test.ts'
      - 'web/lib/supabase/database.types.ts'
      - 'web/package.json'
      - 'supabase/migrations/*onboarding*.sql'
      - 'supabase/migrations/*provider_credentials*.sql'
      - 'docs/NEOFIT_STAGE21_ONBOARDING_SELF_REPORT_V2.md'
      - 'docs/NEOFIT_COACH_PROGRAM_LIFECYCLE_ARCHITECTURE.md'
      - '.github/workflows/onboarding-ci.yml'

permissions:
  contents: read

concurrency:
  group: onboarding-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_VERCEL_ENV: preview
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: |
            web/package.json
            packages/nutrition-core/package.json
      - name: Install workspace dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Onboarding v2 contract tests
        working-directory: web
        run: npm run test:onboarding
      - name: AI provider regression
        working-directory: web
        run: npm run test:ai-provider
      - name: Full Supabase app regression
        working-directory: web
        run: npm run test:supabase-app
      - name: TypeScript
        working-directory: web
        run: npm run typecheck
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Verify lifecycle boundaries
        shell: bash
        run: |
          set -euo pipefail
          ONBOARDING_FILE=supabase/migrations/20260808132547_user_onboarding_v1.sql
          HARDENING_FILE=supabase/migrations/20260810001227_harden_onboarding_v2_shape.sql
          CREDENTIAL_FILE=supabase/migrations/20260808160000_encrypted_provider_credentials.sql
          grep -q 'alter table public.user_onboarding enable row level security' "$ONBOARDING_FILE"
          grep -q 'to authenticated' "$ONBOARDING_FILE"
          grep -q '(select auth.uid()) = user_id' "$ONBOARDING_FILE"
          grep -q "status in ('draft', 'completed')" "$ONBOARDING_FILE"
          grep -q 'current_step between 1 and 15' "$ONBOARDING_FILE"
          grep -q 'user_onboarding_draft_version_matches' "$HARDENING_FILE"
          grep -q 'user_onboarding_v2_current_step_valid' "$HARDENING_FILE"
          grep -q 'current_step between 1 and 13' "$HARDENING_FILE"
          grep -q 'enable row level security' "$CREDENTIAL_FILE"
          grep -q "provider in ('google', 'avalai')" "$CREDENTIAL_FILE"
          grep -q 'ONBOARDING_SCHEMA_VERSION = 2' web/lib/onboarding/model.ts
          grep -q 'ONBOARDING_TOTAL_STEPS = 13' web/lib/onboarding/model.ts
          grep -q 'programDurationDays' web/lib/onboarding/model.ts
          grep -q 'bodyweight' web/lib/onboarding/model.ts
          grep -q '/api/ai/providers' web/components/onboarding/onboarding-ai-gate.tsx
          grep -q 'onboarding-body-map__list-picker' web/components/onboarding/body-map/injury-body-map.tsx
          grep -q 'AUTOSAVE_DELAY_MS' web/components/onboarding/onboarding-context.tsx
          grep -q 'OnboardingConflictError' web/lib/onboarding/persistence.ts
          grep -q 'activeAuthSession(supabase)' web/app/onboarding/ready/page.tsx
          grep -q "google: 'gemini-3.5-flash-lite'" web/lib/ai/config.ts
          grep -q "avalai: 'gemini-flash-latest'" web/lib/ai/config.ts
          ! grep -q '/onboarding/ai' web/app/page.tsx
          ! grep -Eq 'localStorage|sessionStorage' web/components/onboarding/onboarding-ai-gate.tsx
          grep -q 'Nutrition Core' web/lib/onboarding/model.ts
          if grep -Ei '\b(calorieTarget|proteinGrams|carbohydrateGrams|fatGrams|bmr)\b' web/lib/onboarding/model.ts; then
            echo 'Legacy nutrition arithmetic detected inside onboarding model.' >&2
            exit 1
          fi
