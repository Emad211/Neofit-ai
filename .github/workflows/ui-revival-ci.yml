name: UI Revival CI

on:
  push:
    branches:
      - revival/firebase-ui-front
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.github/workflows/ui-revival-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-revival-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_FIREBASE_API_KEY: 'AIzaSyDemoNeoFitPreviewKey0000000000000'
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'neofit-preview.firebaseapp.com'
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'neofit-preview'
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: 'neofit-preview.appspot.com'
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:neofitpreview'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build historical UI migration candidate
        run: npm run build

      - name: Verify migrated UI routes and Firebase-free render boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'redirect("/today")' src/app/page.tsx
          grep -q 'lang="fa" dir="rtl"' src/app/layout.tsx
          grep -q 'demo-emad' src/context/user-profile-context.tsx
          ! grep -q 'from "firebase/' src/context/user-profile-context.tsx
          test -s src/app/'(main)'/today/page.tsx
          test -s src/app/'(main)'/nutrition/page.tsx
          test -s src/app/'(main)'/workout/page.tsx
          test -s src/app/'(main)'/progress/page.tsx
