name: UI Revival CI

on:
  push:
    branches:
      - 'revival/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-revival-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Verify obsolete runtime is absent
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          parts = [
              ('fire', 'base'),
              ('fire', 'store'),
              ('gen', 'kit'),
              ('app', 'hosting'),
              ('google', 'ai'),
              ('dot', 'prompt'),
          ]
          forbidden = [''.join(item).lower() for item in parts]
          forbidden += ['next_public_' + forbidden[0], '@/ai/']
          failures = []

          roots = [
              Path('src'),
              Path('scripts'),
              Path('package.json'),
              Path('next.config.ts'),
              Path('README.md'),
              Path('REVIVAL.md'),
          ]
          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.exists():
                  files.extend(path for path in root.rglob('*') if path.is_file())

          for path in files:
              text = path.read_text(errors='ignore').lower()
              for needle in forbidden:
                  if needle in text:
                      failures.append(f'{path}: {needle}')

          lock = json.loads(Path('package-lock.json').read_text())
          for key in (lock.get('packages') or {}):
              lower = key.lower()
              for needle in forbidden[:6]:
                  if needle in lower:
                      failures.append(f'package-lock.json: {key}')

          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          PY

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify route contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'redirect("/today")' src/app/page.tsx
          grep -q 'lang="fa" dir="rtl"' src/app/layout.tsx
          grep -q 'demo-emad' src/context/user-profile-context.tsx
          test -s src/app/'(main)'/today/page.tsx
          test -s src/app/'(main)'/today/loading.tsx
          test -s src/app/'(main)'/today/error.tsx
          test -s src/app/'(main)'/notifications/page.tsx
          test -s src/app/'(main)'/nutrition/page.tsx
          test -s src/app/'(main)'/nutrition/loading.tsx
          test -s src/app/'(main)'/nutrition/error.tsx
          test -s src/app/'(main)'/nutrition/history/page.tsx
          test -s src/app/'(main)'/workout/page.tsx
          test -s src/app/'(main)'/workout/loading.tsx
          test -s src/app/'(main)'/workout/error.tsx
          test -s src/app/'(main)'/workout/'[id]'/page.tsx
          test -s src/app/'(main)'/workout/history/page.tsx
          test -s src/app/'(main)'/workout-player/'[slug]'/page.tsx
          test -s src/app/'(main)'/progress/page.tsx
          test -s src/app/'(main)'/progress/loading.tsx
          test -s src/app/'(main)'/progress/error.tsx
          test -s src/app/'(main)'/profile/page.tsx
          test -s src/app/offline/page.tsx

      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.61.1
          npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/neofit-ui.log 2>&1 &
          echo $! > /tmp/neofit-ui.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/today > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/neofit-ui.log
          exit 1

      - name: Mobile browser runtime gate
        run: node scripts/verify-ui-revival.mjs

      - name: Tablet and desktop responsive gate
        run: node scripts/verify-responsive-shell.mjs

      - name: Workout day-details, resume and completion gate
        run: node scripts/verify-workout-flow.mjs

      - name: Nutrition plan, history and logging gate
        run: node scripts/verify-nutrition-flow.mjs

      - name: Progress overview and trend gate
        run: node scripts/verify-progress-flow.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neofit-ui-runtime
          path: artifacts/ui-revival-smoke
          if-no-files-found: warn
          retention-days: 30

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if test -f /tmp/neofit-ui.pid; then
            kill "$(cat /tmp/neofit-ui.pid)" 2>/dev/null || true
          fi
