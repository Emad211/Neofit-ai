name: UI Revival CI

on:
  push:
    branches:
      - revival/firebase-ui-front
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'scripts/verify-ui-revival.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.github/workflows/ui-revival-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-revival-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Verify legacy stack is absent
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          pieces = [
              ('fire', 'base'),
              ('fire', 'store'),
              ('gen', 'kit'),
              ('app', 'hosting'),
              ('google', 'ai'),
              ('dot', 'prompt'),
          ]
          forbidden = [''.join(value).lower() for value in pieces]
          forbidden.extend(['next_public_' + forbidden[0], '@/ai/'])
          failures = []

          for path in Path('.').rglob('*'):
              if not path.is_file():
                  continue
              if any(part in {'.git', 'node_modules', 'artifacts'} for part in path.parts):
                  continue
              if path == Path('.github/workflows/ui-revival-ci.yml'):
                  continue
              try:
                  text = path.read_text(errors='ignore').lower()
              except Exception:
                  continue
              for needle in forbidden:
                  if needle in text:
                      failures.append(f'{path}: {needle}')

          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          PY

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify migrated UI contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'redirect("/today")' src/app/page.tsx
          grep -q 'lang="fa" dir="rtl"' src/app/layout.tsx
          grep -q 'demo-emad' src/context/user-profile-context.tsx
          test -s src/app/'(main)'/today/page.tsx
          test -s src/app/'(main)'/nutrition/page.tsx
          test -s src/app/'(main)'/workout/page.tsx
          test -s src/app/'(main)'/progress/page.tsx
          test -s src/app/'(main)'/profile/page.tsx

      - name: Install browser runtime gate
        run: |
          npm install --no-save --no-package-lock playwright@1.61.1
          npx playwright install --with-deps chromium

      - name: Start built application
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/neofit-ui-revival.log 2>&1 &
          echo $! > /tmp/neofit-ui-revival.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/today > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/neofit-ui-revival.log
          exit 1

      - name: Verify real browser routes
        run: node scripts/verify-ui-revival.mjs

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neofit-ui-revival-runtime
          path: artifacts/ui-revival-smoke
          if-no-files-found: error
          retention-days: 30

      - name: Stop built application
        if: always()
        shell: bash
        run: |
          if test -f /tmp/neofit-ui-revival.pid; then
            kill "$(cat /tmp/neofit-ui-revival.pid)" 2>/dev/null || true
          fi
