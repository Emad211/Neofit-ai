name: Fix Nutrition Goals Contract

on:
  pull_request:
    branches:
      - agent/mobile-local-first-expo
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/fix-nutrition-goals-contract.yml'
      - 'ifkb/dev/fix-nutrition-goals-contract.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iranian-food-kb-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Apply exact repository-contract fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('mobile/app/nutrition-goals.tsx')
          text=path.read_text(encoding='utf-8')
          replacements=(
            ("goal?.dailyGoals[field.key] === undefined ? '' : String(goal.dailyGoals[field.key])",
             "goal?.goals.daily[field.key] === undefined ? '' : String(goal.goals.daily[field.key])"),
            ("        dailyGoals,\n", "        goals: { daily: dailyGoals },\n"),
            ("        dailyGoals: {},\n", "        goals: { daily: {} },\n"),
          )
          for old,new in replacements:
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match for {old!r}, found {count}')
              text=text.replace(old,new)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Validate goals fix
        working-directory: mobile
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm ci --no-audit --no-fund > /tmp/npm-ci.log 2>&1 || { cat /tmp/npm-ci.log; exit 1; }
          npm test > /tmp/npm-test.log 2>&1 || { cat /tmp/npm-test.log; exit 1; }
          npm run typecheck
      - name: Remove temporary files
        run: |
          rm -f ifkb/dev/fix-nutrition-goals-contract.trigger
          rm -f .github/workflows/fix-nutrition-goals-contract.yml
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(nutrition): align goals screen with persisted goal contract'
          git pull --rebase origin agent/iranian-food-kb-foundation
          git push origin HEAD:agent/iranian-food-kb-foundation
