name: Android Release Startup Smoke

on:
  pull_request:
    branches:
      - agent/iranian-food-kb-foundation
    paths:
      - '.github/workflows/android-startup-smoke.yml'
      - '.github/scripts/android-startup-smoke.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-startup-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify the fixed QA APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/qa-apk
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/Emad211/Neofit-ai/actions/artifacts/8843370288/zip' \
            -o build/qa-apk-artifact.zip
          echo '42a3dcccae6d2bc1d45a52cf5d8eebd18266675b49c212128de6a7a061d0424a  build/qa-apk-artifact.zip' | sha256sum --check --strict
          unzip -q build/qa-apk-artifact.zip -d build/qa-apk
          test -s build/qa-apk/neofit-stage9-qa.apk
          echo '8711291002099979bcd7fa1609cfc00daf9f60032880e118ed5a37803d080b5d  build/qa-apk/neofit-stage9-qa.apk' | sha256sum --check --strict
          grep -q '^javascriptBundle=embedded$' build/qa-apk/build-metadata.txt
          unzip -l build/qa-apk/neofit-stage9-qa.apk | grep -q 'assets/index.android.bundle'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch exact release APK and capture startup evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: bash .github/scripts/android-startup-smoke.sh

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neofit-android-startup-smoke-fixed
          path: build/startup-smoke
          if-no-files-found: error
          retention-days: 30

      - name: Enforce startup usability
        if: always()
        shell: bash
        run: |
          test -s build/startup-smoke/result.txt
          cat build/startup-smoke/result.txt
          grep -q '^status=alive_after_60s$' build/startup-smoke/result.txt
