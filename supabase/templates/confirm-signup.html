<!doctype html>
<html lang="fa" dir="rtl">
  <body style="font-family:Arial,sans-serif;line-height:1.8;color:#183428;background:#f5f8f6;padding:24px">
    <div style="max-width:560px;margin:0 auto;background:#fff;border:1px solid #dce8e1;border-radius:20px;padding:28px">
      <p style="margin:0;color:#176b47;font-weight:700">NeoFit</p>
      <h1 style="margin:8px 0 12px;font-size:24px">تأیید ایمیل نئوفیت</h1>
      <p>برای فعال‌سازی حساب و ساخت نشست امن، روی دکمه زیر بزن.</p>
      <p style="margin:26px 0">
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/onboarding" style="display:inline-block;background:#176b47;color:#fff;text-decoration:none;border-radius:12px;padding:12px 20px;font-weight:700">تأیید ایمیل و ادامه</a>

    </div>
